<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
  rel="stylesheet"
>

<title>Liquid Glass Morph Dock</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: dark;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  min-width: 100vw;
  min-height: 100vh;
  min-height: 100dvh;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 23% 17%,
      rgba(74, 117, 255, .35),
      transparent 31%
    ),
    radial-gradient(
      circle at 77% 73%,
      rgba(211, 72, 255, .29),
      transparent 35%
    ),
    radial-gradient(
      circle at 50% 42%,
      rgba(70, 211, 255, .09),
      transparent 30%
    ),
    linear-gradient(
      145deg,
      #11172b 0%,
      #070913 59%,
      #121323 100%
    );
}

body::before {
  content: "";

  position: fixed;
  inset: 0;

  pointer-events: none;

  background:
    repeating-linear-gradient(
      115deg,
      transparent 0 70px,
      rgba(255,255,255,.024) 71px,
      transparent 72px 135px
    );
}

body::after {
  content: "";

  position: fixed;

  left: 50%;
  top: 50%;

  width: 560px;
  height: 560px;

  transform: translate(-50%, -50%);

  pointer-events: none;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.035),
      transparent 66%
    );

  filter: blur(14px);
}


/* --------------------------------------------------
   DEMO
-------------------------------------------------- */

.demo-stage {
  position: relative;

  width: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 80px 30px;
}

.dock-system {
  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  padding-top: 66px;
}


/* --------------------------------------------------
   DOCK SHELL
-------------------------------------------------- */

.action-bar {
  position: relative;

  display: flex;
  align-items: center;

  height: 70px;

  gap: 7px;

  padding: 10px;

  border: 1px solid rgba(255,255,255,.13);
  border-radius: 25px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.035)
    );

  box-shadow:
    0 24px 70px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.17),
    inset 0 -1px 0 rgba(255,255,255,.045);

  backdrop-filter:
    blur(28px)
    saturate(145%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(145%);

  isolation: isolate;
}

.action-bar::before {
  content: "";

  position: absolute;
  inset: 1px;

  z-index: 0;

  pointer-events: none;

  border-radius: inherit;

  background:
    linear-gradient(
      115deg,
      rgba(255,255,255,.14),
      transparent 23%,
      transparent 66%,
      rgba(255,255,255,.055)
    );

  opacity: .8;
}


/* --------------------------------------------------
   ICON BUTTONS
-------------------------------------------------- */

.action-bar button {
  position: relative;
  z-index: 5;

  width: 48px;
  height: 48px;

  flex: 0 0 48px;

  padding: 0;

  display: grid;
  place-items: center;

  border: 0;
  outline: none;

  border-radius: 18px;

  color: rgba(255,255,255,.56);

  background: transparent;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;

  transition:
    color .25s ease,
    transform .36s cubic-bezier(.16,1,.3,1);
}

.action-bar button:hover,
.action-bar button:focus-visible,
.action-bar button.selected {
  color: rgba(255,255,255,.98);
}

.action-bar button:hover {
  transform: scale(1.045);
}

.action-bar button:focus-visible {
  outline: 2px solid rgba(255,255,255,.45);
  outline-offset: 4px;
}

.material-symbols-outlined {
  font-size: var(--icon-size, 23px);

  line-height: 1;

  font-variation-settings:
    "FILL" 0,
    "wght" 420,
    "GRAD" 0,
    "opsz" 24;

  transition:
    transform .38s cubic-bezier(.16,1,.3,1),
    font-variation-settings .25s ease;
}

button:hover .material-symbols-outlined,
button.selected .material-symbols-outlined {
  font-variation-settings:
    "FILL" 0,
    "wght" 520,
    "GRAD" 20,
    "opsz" 24;
}


/* --------------------------------------------------
   MOVING ICON GLASS
-------------------------------------------------- */

.icon-glass {
  position: absolute;

  z-index: 2;

  left: 10px;
  top: 11px;

  width: 48px;
  height: 48px;

  pointer-events: none;

  transition:
    left .52s cubic-bezier(.18,.84,.25,1.12),
    top .46s cubic-bezier(.18,.84,.25,1.08),
    width .4s cubic-bezier(.16,1,.3,1),
    height .4s cubic-bezier(.16,1,.3,1);
}

.icon-glass-surface {
  position: absolute;
  inset: 0;

  overflow: hidden;

  border: 1px solid rgba(255,255,255,.24);

  border-radius: 18px;

  background:
    radial-gradient(
      circle at 28% 13%,
      rgba(255,255,255,.31),
      transparent 34%
    ),
    radial-gradient(
      circle at 77% 84%,
      rgba(127,203,255,.10),
      transparent 45%
    ),
    linear-gradient(
      135deg,
      rgba(255,255,255,.16),
      rgba(255,255,255,.05) 47%,
      rgba(255,255,255,.11)
    );

  box-shadow:
    0 10px 27px rgba(0,0,0,.17),
    0 2px 8px rgba(0,0,0,.14),
    inset 0 1px 0 rgba(255,255,255,.43),
    inset 1px 0 0 rgba(255,255,255,.11),
    inset 0 -1px 1px rgba(0,0,0,.15);

  backdrop-filter:
    blur(18px)
    saturate(160%)
    brightness(1.10);

  -webkit-backdrop-filter:
    blur(18px)
    saturate(160%)
    brightness(1.10);

  transform-origin: center;
}

.icon-glass-surface::before {
  content: "";

  position: absolute;

  left: 6%;
  right: 6%;
  top: 2px;

  height: 43%;

  border-radius: inherit;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.34),
      rgba(255,255,255,.075) 46%,
      transparent
    );

  opacity: .72;
}

.icon-glass-surface::after {
  content: "";

  position: absolute;

  width: 52%;
  height: 125%;

  top: -43%;
  left: -40%;

  transform: rotate(25deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.17),
      transparent
    );

  filter: blur(8px);

  animation: iconShimmer 5.2s ease-in-out infinite;
}

@keyframes iconShimmer {
  0%,
  100% {
    left: -40%;
    opacity: .4;
  }

  50% {
    left: 96%;
    opacity: .78;
  }
}


/* --------------------------------------------------
   DIRECTIONAL GLASS DEFORMATION
-------------------------------------------------- */

.icon-glass.move-right .icon-glass-surface {
  animation:
    travelRight .48s cubic-bezier(.22,.8,.3,1);
}

.icon-glass.move-left .icon-glass-surface {
  animation:
    travelLeft .48s cubic-bezier(.22,.8,.3,1);
}

@keyframes travelRight {
  0% {
    transform:
      translateX(0)
      skewX(0deg)
      scaleX(1)
      scaleY(1);
  }

  25% {
    transform:
      translateX(2px)
      skewX(-7deg)
      scaleX(1.10)
      scaleY(.91);
  }

  55% {
    transform:
      translateX(-1px)
      skewX(3deg)
      scaleX(.965)
      scaleY(1.045);
  }

  78% {
    transform:
      skewX(-1deg)
      scaleX(1.025)
      scaleY(.985);
  }

  100% {
    transform:
      translateX(0)
      skewX(0)
      scaleX(1)
      scaleY(1);
  }
}

@keyframes travelLeft {
  0% {
    transform:
      translateX(0)
      skewX(0deg)
      scaleX(1)
      scaleY(1);
  }

  25% {
    transform:
      translateX(-2px)
      skewX(7deg)
      scaleX(1.10)
      scaleY(.91);
  }

  55% {
    transform:
      translateX(1px)
      skewX(-3deg)
      scaleX(.965)
      scaleY(1.045);
  }

  78% {
    transform:
      skewX(1deg)
      scaleX(1.025)
      scaleY(.985);
  }

  100% {
    transform:
      translateX(0)
      skewX(0)
      scaleX(1)
      scaleY(1);
  }
}


/* --------------------------------------------------
   LABEL SYSTEM
-------------------------------------------------- */

.liquid-label-wrap {
  position: absolute;

  z-index: 10;

  left: 0;
  top: 0;

  height: 42px;

  pointer-events: none;

  transform:
    translateX(-50%)
    translateY(10px)
    scale(.82);

  transform-origin: center bottom;

  opacity: 0;

  filter: blur(5px);

  transition:
    left .50s cubic-bezier(.18,.84,.25,1.1),
    width .42s cubic-bezier(.16,1,.3,1),
    opacity .16s ease,
    filter .22s ease,
    transform .35s cubic-bezier(.16,1,.3,1);
}

.liquid-label-wrap.visible {
  opacity: 1;

  filter: blur(0);

  transform:
    translateX(-50%)
    translateY(0)
    scale(1);
}

.liquid-label-wrap.hiding {
  opacity: 0;

  filter: blur(4px);

  transform:
    translateX(-50%)
    translateY(9px)
    scale(.82);
}

.liquid-label-glass {
  position: relative;

  height: 38px;

  min-width: 58px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0 17px;

  overflow: hidden;

  border: 1px solid rgba(255,255,255,.22);

  border-radius: 17px;

  background:
    radial-gradient(
      circle at 30% 7%,
      rgba(255,255,255,.27),
      transparent 38%
    ),
    linear-gradient(
      145deg,
      rgba(255,255,255,.15),
      rgba(255,255,255,.055) 46%,
      rgba(255,255,255,.10)
    );

  box-shadow:
    0 11px 28px rgba(0,0,0,.16),
    inset 0 1px 0 rgba(255,255,255,.39),
    inset 0 -1px 0 rgba(0,0,0,.12);

  backdrop-filter:
    blur(18px)
    saturate(155%)
    brightness(1.1);

  -webkit-backdrop-filter:
    blur(18px)
    saturate(155%)
    brightness(1.1);
}

.liquid-label-glass::before {
  content: "";

  position: absolute;

  left: 7%;
  right: 7%;
  top: 1px;

  height: 46%;

  border-radius: inherit;

  pointer-events: none;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.31),
      rgba(255,255,255,.055),
      transparent
    );
}

.liquid-label-glass::after {
  content: "";

  position: absolute;

  top: -42%;
  left: -35%;

  width: 42%;
  height: 145%;

  transform: rotate(25deg);

  pointer-events: none;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.15),
      transparent
    );

  filter: blur(7px);

  animation:
    labelShimmer 4.8s ease-in-out infinite;
}

@keyframes labelShimmer {
  0%,
  100% {
    left: -40%;
  }

  50% {
    left: 105%;
  }
}

.liquid-label {
  position: relative;

  z-index: 2;

  color: rgba(255,255,255,.96);

  white-space: nowrap;

  font-size: 13px;
  font-weight: 570;

  line-height: 1;

  letter-spacing: -.015em;
}


/* --------------------------------------------------
   CONNECTION NECK
-------------------------------------------------- */

.label-neck {
  position: absolute;

  z-index: -1;

  left: 50%;
  bottom: -8px;

  width: 18px;
  height: 14px;

  transform:
    translateX(-50%)
    scaleY(.85);

  border-radius:
    4px 4px 8px 8px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.11),
      rgba(255,255,255,.055)
    );

  border-left:
    1px solid rgba(255,255,255,.11);

  border-right:
    1px solid rgba(255,255,255,.11);

  backdrop-filter:
    blur(13px);

  -webkit-backdrop-filter:
    blur(13px);
}

.label-neck::after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -4px;

  width: 8px;
  height: 8px;

  transform:
    translateX(-50%)
    rotate(45deg);

  border-radius:
    1px 1px 4px 1px;

  background:
    rgba(255,255,255,.07);

  border-right:
    1px solid rgba(255,255,255,.12);

  border-bottom:
    1px solid rgba(255,255,255,.10);
}


/* --------------------------------------------------
   SUBTLE ACTIVE ICON RESPONSE
-------------------------------------------------- */

.action-bar button.active-hover .material-symbols-outlined {
  transform:
    translateY(-1px)
    scale(1.06);
}


/* --------------------------------------------------
   MOBILE
-------------------------------------------------- */

@media (max-width: 520px) {
  .demo-stage {
    padding:
      70px 18px;
  }

  .dock-system {
    padding-top: 62px;
  }

  .action-bar {
    gap: 3px;

    padding-left: 7px;
    padding-right: 7px;
  }

  .action-bar button {
    width: 45px;
    height: 46px;

    flex-basis: 45px;
  }
}


/* --------------------------------------------------
   REDUCED MOTION
-------------------------------------------------- */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="demo-stage">

  <div class="dock-system" id="dockSystem">

    <div class="liquid-label-wrap" id="labelWrap">

      <div class="liquid-label-glass" id="labelGlass">

        <span
          class="liquid-label"
          id="liquidLabel"
        ></span>

        <span class="label-neck"></span>

      </div>

    </div>


    <nav
      class="action-bar"
      id="actionBar"
      aria-label="Demo navigation"
    >

      <div
        class="icon-glass"
        id="iconGlass"
      >
        <div class="icon-glass-surface"></div>
      </div>


      <button
        type="button"
        data-label="Profile"
        aria-label="Profile"
        style="--icon-size:24px"
      >
        <span class="material-symbols-outlined">
          person
        </span>
      </button>


      <button
        type="button"
        data-label="Pinned"
        aria-label="Pinned"
        style="--icon-size:22px"
      >
        <span class="material-symbols-outlined">
          push_pin
        </span>
      </button>


      <button
        type="button"
        class="selected"
        data-label="Following"
        aria-label="Following"
        style="--icon-size:23px"
      >
        <span class="material-symbols-outlined">
          alternate_email
        </span>
      </button>


      <button
        type="button"
        data-label="Inbox"
        aria-label="Inbox"
        style="--icon-size:22px"
      >
        <span class="material-symbols-outlined">
          mail
        </span>
      </button>


      <button
        type="button"
        data-label="Edit"
        aria-label="Edit"
        style="--icon-size:21px"
      >
        <span class="material-symbols-outlined">
          edit
        </span>
      </button>


      <button
        type="button"
        data-label="Business"
        aria-label="Business"
        style="--icon-size:25px"
      >
        <span class="material-symbols-outlined">
          cases
        </span>
      </button>

    </nav>

  </div>

</div>


<script>
const dockSystem =
  document.getElementById("dockSystem");

const bar =
  document.getElementById("actionBar");

const iconGlass =
  document.getElementById("iconGlass");

const labelWrap =
  document.getElementById("labelWrap");

const labelGlass =
  document.getElementById("labelGlass");

const liquidLabel =
  document.getElementById("liquidLabel");

const buttons =
  [...bar.querySelectorAll("button")];


let selected =
  bar.querySelector(".selected") ||
  buttons[0];

let currentButton =
  selected;

let pendingButton =
  null;

let moveTimer =
  null;

let labelTimer =
  null;

let leaveTimer =
  null;

let sequence =
  0;


/* --------------------------------------------------
   TEXT MEASUREMENT
-------------------------------------------------- */

const measure =
  document.createElement("span");

Object.assign(
  measure.style,
  {
    position: "fixed",
    left: "-9999px",
    top: "-9999px",
    visibility: "hidden",
    pointerEvents: "none",
    whiteSpace: "nowrap",
    fontSize: "13px",
    fontWeight: "570",
    letterSpacing: "-0.015em",
    fontFamily:
      getComputedStyle(document.body)
        .fontFamily
  }
);

document.body.appendChild(measure);


function getTextWidth(text) {
  measure.textContent = text;

  return Math.ceil(
    measure.getBoundingClientRect().width
  );
}


/* --------------------------------------------------
   GEOMETRY
-------------------------------------------------- */

function getGeometry(button) {
  const barRect =
    bar.getBoundingClientRect();

  const dockRect =
    dockSystem.getBoundingClientRect();

  const buttonRect =
    button.getBoundingClientRect();

  return {
    barX:
      buttonRect.left -
      barRect.left +
      buttonRect.width / 2,

    barY:
      buttonRect.top -
      barRect.top +
      buttonRect.height / 2,

    dockX:
      buttonRect.left -
      dockRect.left +
      buttonRect.width / 2,

    buttonWidth:
      buttonRect.width,

    buttonHeight:
      buttonRect.height
  };
}


/* --------------------------------------------------
   MOVEMENT DIRECTION
-------------------------------------------------- */

function getDirection(nextButton) {
  if (
    !currentButton ||
    currentButton === nextButton
  ) {
    return 0;
  }

  const current =
    getGeometry(currentButton).barX;

  const next =
    getGeometry(nextButton).barX;

  return next > current
    ? 1
    : -1;
}


/* --------------------------------------------------
   LABEL
-------------------------------------------------- */

function hideLabel() {
  clearTimeout(labelTimer);

  labelWrap.classList.remove("visible");
  labelWrap.classList.add("hiding");
}


function showLabel(button, token) {
  if (token !== sequence) {
    return;
  }

  const geometry =
    getGeometry(button);

  const text =
    button.dataset.label || "";

  const textWidth =
    getTextWidth(text);

  const width =
    Math.max(
      58,
      textWidth + 34
    );

  liquidLabel.textContent =
    text;

  labelWrap.style.left =
    `${geometry.dockX}px`;

  labelWrap.style.width =
    `${width}px`;

  labelGlass.style.width =
    `${width}px`;

  labelWrap.classList.remove("hiding");

  requestAnimationFrame(() => {
    if (token !== sequence) {
      return;
    }

    labelWrap.classList.add("visible");
  });
}


/* --------------------------------------------------
   ICON GLASS MOVEMENT
-------------------------------------------------- */

function moveGlass(button) {
  clearTimeout(moveTimer);

  const direction =
    getDirection(button);

  const geometry =
    getGeometry(button);


  buttons.forEach(item => {
    item.classList.toggle(
      "active-hover",
      item === button
    );
  });


  iconGlass.classList.remove(
    "move-left",
    "move-right"
  );


  void iconGlass.offsetWidth;


  if (direction > 0) {
    iconGlass.classList.add(
      "move-right"
    );
  }

  if (direction < 0) {
    iconGlass.classList.add(
      "move-left"
    );
  }


  const width =
    geometry.buttonWidth + 2;

  const height =
    geometry.buttonHeight + 2;


  iconGlass.style.width =
    `${width}px`;

  iconGlass.style.height =
    `${height}px`;

  iconGlass.style.left =
    `${
      geometry.barX -
      width / 2
    }px`;

  iconGlass.style.top =
    `${
      geometry.barY -
      height / 2
    }px`;


  moveTimer =
    setTimeout(() => {
      iconGlass.classList.remove(
        "move-left",
        "move-right"
      );
    }, 500);


  currentButton =
    button;
}


/* --------------------------------------------------
   FULL TRANSITION
-------------------------------------------------- */

function activateHover(button) {
  clearTimeout(leaveTimer);

  pendingButton =
    button;

  sequence++;

  const token =
    sequence;


  /*
    Phase 1:
    Existing word gets out of the way.
  */

  hideLabel();


  /*
    Phase 2:
    Glass begins moving almost immediately.
  */

  setTimeout(() => {
    if (token !== sequence) {
      return;
    }

    moveGlass(button);
  }, 40);


  /*
    Phase 3:
    New label grows after the blob has nearly landed.
  */

  labelTimer =
    setTimeout(() => {
      if (token !== sequence) {
        return;
      }

      showLabel(
        button,
        token
      );
    }, 235);
}


/* --------------------------------------------------
   RETURN TO SELECTED STATE
-------------------------------------------------- */

function returnToSelected() {
  sequence++;

  const token =
    sequence;

  hideLabel();


  setTimeout(() => {
    if (token !== sequence) {
      return;
    }

    moveGlass(selected);
  }, 45);


  labelTimer =
    setTimeout(() => {
      if (token !== sequence) {
        return;
      }

      /*
        Resting state intentionally has no word.

        This keeps the dock quiet when nobody
        is interacting with it.
      */

      labelWrap.classList.remove(
        "visible"
      );

    }, 230);
}


/* --------------------------------------------------
   EVENTS
-------------------------------------------------- */

buttons.forEach(button => {

  button.addEventListener(
    "pointerenter",
    () => {
      activateHover(button);
    }
  );


  button.addEventListener(
    "focus",
    () => {
      activateHover(button);
    }
  );


  button.addEventListener(
    "click",
    () => {

      if (selected) {
        selected.classList.remove(
          "selected"
        );
      }

      selected =
        button;

      selected.classList.add(
        "selected"
      );

      activateHover(button);

    }
  );

});


bar.addEventListener(
  "pointerenter",
  () => {
    clearTimeout(leaveTimer);
  }
);


bar.addEventListener(
  "pointerleave",
  () => {

    clearTimeout(leaveTimer);

    leaveTimer =
      setTimeout(() => {
        returnToSelected();
      }, 120);

  }
);


window.addEventListener(
  "resize",
  () => {

    sequence++;

    hideLabel();

    requestAnimationFrame(() => {
      moveGlass(selected);
    });

  }
);


/* --------------------------------------------------
   INITIAL STATE
-------------------------------------------------- */

requestAnimationFrame(() => {
  moveGlass(selected);

  labelWrap.classList.remove(
    "visible"
  );
});
</script>

</body>
