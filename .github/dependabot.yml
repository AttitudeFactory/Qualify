# Dependabot — weekly, grouped, capped so it does not eat the Actions minutes
# (each PR triggers the `ci` workflow). Minor + patch bumps arrive as ONE PR per
# ecosystem; majors come alone so they can be reviewed on their own.
version: 2
updates:
  # Python: the uv workspace (root pyproject.toml + uv.lock). Dependabot has native
  # `uv` support; it bumps the lock without touching the `ml`/torch group unless that
  # group's pins change.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # Node: the Remotion render service (packages/render, lands with PR #65). Until
  # package.json exists on main, Dependabot simply logs "no manifest" and skips it.
  - package-ecosystem: "npm"
    directory: "/packages/render"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions: our workflows pin SHAs; Dependabot bumps SHA + the version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(ci)"

  # Docker: base image of the render service image (node:22-bookworm-slim).
  - package-ecosystem: "docker"
    directory: "/packages/render"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
