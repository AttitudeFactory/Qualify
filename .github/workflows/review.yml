# Automatic code review for pull requests — three independent jobs:
#
#   ruff            ruff findings annotated on the PR diff via reviewdog. Uses only
#                   GITHUB_TOKEN; no extra secret. Never fails the PR (ci.yml does).
#   claude-review   automatic review by Claude on every non-draft PR to main.
#   claude-mention  on-demand `@claude ...` in issue / PR comments.
#
# SECRETS (one of the two is enough; without either, the Claude jobs end green with
# a notice — nothing in CI breaks):
#   CLAUDE_CODE_OAUTH_TOKEN  Claude Pro/Max subscription token, generated locally with
#                            `claude setup-token` (uses the subscription, no API billing).
#   ANTHROPIC_API_KEY        Claude Console API key (pay-per-token). Only used when the
#                            OAuth token is absent.
# Full runbook, costs and alternatives: docs/calidad-codigo-revision-automatica.md
#
# `claude-mention` authenticates to GitHub as the Claude GitHub App
# (https://github.com/apps/claude) so that commits it pushes still trigger ci.yml —
# install the app once on the repo. `claude-review` only comments, so it uses the
# plain GITHUB_TOKEN and needs no app.

name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  ruff:
    name: ruff annotations (reviewdog)
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: review-ruff-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12.13"
      # Only the `dev` group (ruff, pytest, pre-commit) — the lockfile's exact ruff
      # version, without pulling the backend/CRM trees.
      - run: uv sync --only-group dev
      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest
      # ruff ships a native rdjson (Reviewdog Diagnostic Format) writer; `--exit-zero`
      # because findings are reported by reviewdog, not by this step's exit code.
      - name: ruff check → rdjson
        run: uv run --no-sync ruff check . --output-format=rdjson --exit-zero > ruff.rdjson
      - name: Annotate ruff findings on the diff
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          reviewdog -f=rdjson -name=ruff
          -reporter=github-pr-review -filter-mode=added
          -level=warning -fail-level=none
          < ruff.rdjson
      # `ruff format --diff` is a unified diff → reviewdog turns it into one-click
      # suggestions on the changed lines. Exit code 1 means "would reformat"; ignore it.
      - name: ruff format → suggestions
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --no-sync ruff format --diff . > ruff-format.diff 2>/dev/null || true
          reviewdog -f=diff -f.diff.strip=0 -name="ruff format" \
            -reporter=github-pr-review -filter-mode=added \
            -level=info -fail-level=none < ruff-format.diff

  claude-review:
    name: Claude auto-review
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    concurrency:
      group: review-claude-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # The `secrets` context is unavailable in `if:`; presence flags go through env.
      HAS_CLAUDE_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Secrets missing → skip with notice
        if: env.HAS_CLAUDE_OAUTH != 'true' && env.HAS_ANTHROPIC_KEY != 'true'
        run: |
          msg="Claude auto-review skipped: neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set (Settings → Secrets → Actions). See docs/calidad-codigo-revision-automatica.md"
          echo "::notice::$msg"
          echo "> $msg" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE_OAUTH == 'true' || env.HAS_ANTHROPIC_KEY == 'true'
        with:
          fetch-depth: 1
      - name: Review with Claude
        if: env.HAS_CLAUDE_OAUTH == 'true' || env.HAS_ANTHROPIC_KEY == 'true'
        # A Claude outage, an expired token or a rate limit must never block a PR.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          # Both inputs map to env with an empty fallback; the action uses whichever
          # is set (OAuth token first). An empty string counts as unset.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Eres el revisor automático de código de Qualify. La rama del PR ya está
            clonada en el directorio de trabajo. Obtén el diff con `gh pr diff` y la
            descripción con `gh pr view`; lee los archivos del repositorio con Read/Grep
            cuando necesites contexto. Lee `CLAUDE.md` (secciones «Conventions» y
            «Data model conventions») antes de opinar.

            Revisa ÚNICAMENTE el código cambiado en este PR, en este orden de prioridad:

            1. Corrección: bugs, casos borde, excepciones no manejadas, condiciones de
               carrera, código muerto introducido, tests que no prueban lo que dicen.
            2. Seguridad: secretos o credenciales en el código, SQL construido por
               concatenación/f-strings (siempre parámetros), rutas o archivos que
               lean/escriban sin validar, dependencias con `Engine`/`Session` fuera de
               `qualify_shared.db.session` (puertas sancionadas: `tenant_session`,
               `admin_session`, `credential_session`).
            3. RLS / multi-tenant: toda tabla nueva o alterada en `migrations/postgres/`
               que tenga columna `tenant_id` necesita `ENABLE ROW LEVEL SECURITY`,
               `FORCE ROW LEVEL SECURITY` y una política `tenant_isolation` basada en
               `NULLIF(current_setting('app.tenant_id', true), '')::uuid`. El `NULLIF`
               es obligatorio — no aceptes una versión «simplificada». Señala también
               cualquier consulta que pueda cruzar tenants.
            4. Convenciones del repo: `ruff` (line-length 100, reglas E/F/I/UP), type
               hints en toda función/método nuevo, Conventional Commits en inglés,
               documentación en `docs/`/README en español y código (identificadores,
               comentarios, docstrings) en inglés, `uv` en vez de `pip`, migraciones
               Alembic reversibles (`downgrade` real) y con RLS en la misma revisión.
            5. «Read the filesystem, not the docs»: si el PR afirma en docs o
               comentarios que algo existe o se comporta de cierta forma, verifícalo
               en el código antes de darlo por bueno; marca las afirmaciones que no
               coinciden con lo que hay en disco.

            Cómo reportar:
            - Usa `mcp__github_inline_comment__create_inline_comment` (con
              `confirmed: true`) para cada hallazgo concreto, anclado en archivo:línea
              del diff. Un hallazgo = un comentario, en español, con el problema, por
              qué importa y, si es obvio, la corrección sugerida en un bloque de código.
            - Al final publica UN solo comentario de resumen con `gh pr comment`:
              máximo 10 líneas, lista de hallazgos por severidad (bloqueante / debería
              / opcional) y, si no hay ninguno, exactamente «Revisión automática: sin
              hallazgos concretos.».
            - No apruebes ni rechaces el PR, no pidas cambios formales, no hagas
              comentarios de estilo que `ruff` ya cubre, no repitas lo que dice el
              diff, no felicites. Si no estás seguro de un hallazgo, dilo con una
              pregunta concreta en vez de afirmarlo.
            - No modifiques archivos ni hagas commits.

  claude-mention:
    name: "@claude on demand"
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && contains(github.event.comment.body, '@claude')
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    concurrency:
      group: review-mention-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.comment.id }}
    env:
      HAS_CLAUDE_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Secrets missing → skip with notice
        if: env.HAS_CLAUDE_OAUTH != 'true' && env.HAS_ANTHROPIC_KEY != 'true'
        run: |
          msg="@claude skipped: neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set. See docs/calidad-codigo-revision-automatica.md"
          echo "::notice::$msg"
          echo "> $msg" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE_OAUTH == 'true' || env.HAS_ANTHROPIC_KEY == 'true'
        with:
          fetch-depth: 1
      - name: Run Claude
        if: env.HAS_CLAUDE_OAUTH == 'true' || env.HAS_ANTHROPIC_KEY == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # No github_token here on purpose: the action then authenticates as the Claude
          # GitHub App, whose pushes DO trigger ci.yml (GITHUB_TOKEN pushes do not).
          use_sticky_comment: true
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(uv run --no-sync ruff:*),Bash(uv run --no-sync pytest:*),mcp__github_inline_comment__create_inline_comment"
