# Production deploy (CD) — docs/plan-sre-devops-produccion.md §5, punto 4.
#
#   images:  build deploy/Dockerfile `app`, `web` and `deploy-bundle` (the commit's deploy/
#            dir) for ONE commit of main and push them to GHCR as
#            ghcr.io/attitudefactory/qualify-{app,web,deploy}:<full sha> (GITHUB_TOKEN; GHCR
#            storage is free today, GitHub promises a month's notice before billing it).
#   deploy:  ssh to the server with a key that can ONLY run deploy/server-deploy.sh (forced
#            command) and only send `deploy <sha>`. The server pulls the three images, takes
#            the release's compose file and scripts from qualify-deploy, runs `migrate`, then
#            `up`. It never compiles. Then an external smoke test.
#
# Inert until the founder sets it up (nothing here is invented):
#   secrets   QUALIFY_DEPLOY_SSH_KEY          private half of the restricted deploy key
#             QUALIFY_DEPLOY_SSH_TARGET       e.g. deploy@203.0.113.10
#             QUALIFY_DEPLOY_SSH_KNOWN_HOSTS  `ssh-keyscan -t ed25519 <ip>` output, verified
#             DEVOPS_WEBHOOK_URL              optional: devops notice per deploy (job `notify`)
#   variable  QUALIFY_AUTO_DEPLOY             when to deploy on its own (manual always works):
#               merge (or true)  every push to main = every merge (the PR already passed `ci`)
#               daily            the tip of main once a day, only if it changed
#               anything else    never — manual runs only
#   server    /opt/qualify/bin/server-deploy.sh + authorized_keys line + `docker login ghcr.io`
#             (docs/despliegue-hetzner.md, "Deploy desde GitHub Actions")
#
# Why `daily` exists: on GitHub Free (2,000 min/month) a deploy costs ~8 billed minutes and
# October 2026 saw ~190 merges/month — per-merge deploys alone would eat the whole quota.
# The daily run ships whatever merged that day in one go, and skips when the tip of main
# already has images in GHCR (built = already deployed, or a failed deploy that a human must
# look at — retrying it every night would not help). In the mode that is off, the trigger
# still fires but `resolve` is skipped by its `if:` before any runner starts: zero minutes.
#
# Rollback: run this workflow by hand with an older sha of main (its images are still in
# GHCR). Across a migration, tick `skip_migrate`: the older image cannot run `alembic upgrade`
# on a newer database.
# The calendar-worker profile is never touched here: profiles come from the server's
# .env.prod only.
name: deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit sha (or main) to deploy — must be on main"
        required: false
        default: main
      skip_migrate:
        description: "Rollback across a migration: skip `migrate` (the older code must run on the newer schema)"
        type: boolean
        required: false
        default: false
  push:
    branches: ["main"]
  schedule:
    # Daily 07:23 UTC = 03:23 Caracas — off the hour (GitHub delays on-the-hour crons), and
    # outside business hours, since `up` restarts the app containers for a few seconds.
    - cron: "23 7 * * *"

# One production deploy at a time, never cancelled half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Which commit, and whether to deploy it at all.
  resolve:
    # By hand, always; on its own, per QUALIFY_AUTO_DEPLOY (see the header).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (vars.QUALIFY_AUTO_DEPLOY == 'merge' || vars.QUALIFY_AUTO_DEPLOY == 'true')) ||
      (github.event_name == 'schedule' && vars.QUALIFY_AUTO_DEPLOY == 'daily')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read # the scheduled run asks GHCR whether the tip was already built
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      go: ${{ steps.sha.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      # Production runs reviewed code only: any commit of main (older ones = rollback, by
      # hand), never an unmerged branch. A per-merge run ships its push only while it is
      # still the tip (the concurrency group serializes without ordering, so an older commit
      # must never land on top of a newer one). The scheduled run ships the tip, and only
      # when GHCR has no image for it yet: images are pushed by this workflow alone, right
      # before deploying, so "already built" means "already deployed" (or a failed deploy
      # that needs a human, not a nightly retry). By hand it always goes.
      - id: sha
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main ||
            { echo "::error::$sha is not on main; only commits of main are deployed."; exit 1; }
          go=true
          if [ "$EVENT" = push ] && [ "$sha" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::$sha is no longer the tip of main; the deploy of the tip will ship it."
            go=false
          fi
          if [ "$EVENT" = schedule ]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
            if docker buildx imagetools inspect "ghcr.io/attitudefactory/qualify-app:$sha" >/dev/null 2>&1; then
              echo "::notice::$sha (tip of main) already has images in GHCR — nothing new to deploy."
              go=false
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  images:
    needs: resolve
    if: needs.resolve.outputs.go == 'true'
    # The production server is arm64 (aarch64): an amd64-only image fails `docker pull` with
    # "no matching manifest for linux/arm64/v8". Build natively on an arm64 runner (free tier
    # in private repos since 2026-01) instead of QEMU emulation, which is several times slower.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Own cache scope: ci/docker-deploy builds amd64 into `deploy`, so its layers never
      # match these arm64 ones.
      - name: Build and push qualify-app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: app
          platforms: linux/arm64
          push: true
          tags: ghcr.io/attitudefactory/qualify-app:${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=deploy-arm64
          cache-to: type=gha,scope=deploy-arm64,mode=max
      - name: Build and push qualify-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          platforms: linux/arm64
          push: true
          tags: ghcr.io/attitudefactory/qualify-web:${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=deploy-arm64
      - name: Build and push qualify-deploy (the commit's deploy/ dir)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: deploy-bundle
          platforms: linux/arm64
          push: true
          tags: ghcr.io/attitudefactory/qualify-deploy:${{ steps.sha.outputs.sha }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ needs.images.outputs.sha }}
      PUBLIC_URL: ${{ vars.QUALIFY_PUBLIC_URL || 'https://qualify.attitudefactory.co' }}
    steps:
      - name: Install the restricted deploy key
        env:
          KEY: ${{ secrets.QUALIFY_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.QUALIFY_DEPLOY_SSH_KNOWN_HOSTS }}
          TARGET: ${{ secrets.QUALIFY_DEPLOY_SSH_TARGET }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$TARGET" ]; then
            echo "::error::Deploy secrets are not configured (see the header of this workflow)."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy ${{ needs.images.outputs.sha }} (server pulls, migrates, starts)
        env:
          TARGET: ${{ secrets.QUALIFY_DEPLOY_SSH_TARGET }}
          ACTION: ${{ inputs.skip_migrate && 'rollback' || 'deploy' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes "$TARGET" "$ACTION" "$SHA" </dev/null
      - name: External smoke test
        run: |
          for probe in '/ping 200' '/login 200' '/api/connections/callback?code=x&state=x 303|403'; do
            path=${probe% *}; want=${probe##* }; got=""
            for _ in $(seq 1 10); do
              got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PUBLIC_URL$path" || true)
              case "|$want|" in *"|$got|"*) break ;; esac; sleep 3
            done
            echo "$PUBLIC_URL$path -> $got (want $want)"
            case "|$want|" in *"|$got|"*) ;; *) exit 1 ;; esac
          done
          echo "Deployed $SHA" >> "$GITHUB_STEP_SUMMARY"

  # Tell the devops chat how every deploy that was attempted ended — success or failure,
  # and at which stage. Skipped when auto-deploy is off and nothing was attempted. A missing
  # webhook or an unreachable chat never fails the deploy: it is a notice, not a gate.
  #   secret  DEVOPS_WEBHOOK_URL   Lark custom bot in Qualify-devs:
  #                                https://open.larksuite.com/open-apis/bot/v2/hook/<token>
  #           CLIQ_DEVOPS_WEBHOOK_URL  legacy fallback (Zoho Cliq #devops) until it is deleted
  # The payload carries both `text` (Cliq/Slack) and `msg_type`+`content` (Lark), like
  # qualify_api.support.notify. Lark answers HTTP 200 even when it rejects a message, so its
  # `code` field is checked too.
  notify:
    needs: [resolve, images, deploy]
    if: >-
      always() &&
      (needs.resolve.result == 'failure' || needs.resolve.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Post the result to the devops chat
        env:
          WEBHOOK: ${{ secrets.DEVOPS_WEBHOOK_URL || secrets.CLIQ_DEVOPS_WEBHOOK_URL }}
          RESOLVE: ${{ needs.resolve.result }}
          IMAGES: ${{ needs.images.result }}
          DEPLOY: ${{ needs.deploy.result }}
          SHA: ${{ needs.resolve.outputs.sha || inputs.ref || 'main' }}
          TRIGGER: ${{ github.event_name == 'workflow_dispatch' && format('manual, by {0}', github.actor) || (github.event_name == 'push' && 'auto, merge to main' || 'auto, daily tip of main') }}
          ACTION: ${{ inputs.skip_migrate && 'rollback (no migrate)' || 'deploy' }}
          PUBLIC_URL: ${{ vars.QUALIFY_PUBLIC_URL || 'https://qualify.attitudefactory.co' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::DEVOPS_WEBHOOK_URL is not set; no devops notice."
            exit 0
          fi
          if [ "$DEPLOY" = success ]; then
            head="✅ Producción actualizada"
          elif [ "$RESOLVE" = failure ]; then
            head="❌ Deploy rechazado (el commit no está en main)"
          elif [ "$IMAGES" != success ]; then
            head="❌ Deploy falló construyendo las imágenes — producción sin cambios"
          else
            head="❌ Deploy falló en el servidor o en el smoke test — revisar"
          fi
          text=$(printf '%s\n%s %s · %s\nCommit: %s%s\nRun: %s\n%s' \
            "$head" "$ACTION" "${SHA:0:7}" "$TRIGGER" "$COMMIT_URL" "$SHA" "$RUN_URL" "$PUBLIC_URL")
          if ! answer=$(jq -n --arg text "$text" \
                '{text: $text, msg_type: "text", content: {text: $text}}' |
              curl -sS --fail --max-time 15 -H 'Content-Type: application/json' \
                --data @- "$WEBHOOK"); then
            echo "::warning::Could not post to the devops chat; the deploy result stands."
          else
            # Cliq answers with an empty body; only a JSON `code` other than 0 is a rejection.
            code=$(jq -r '.code // 0' <<<"$answer" 2>/dev/null || true)
            if [ "${code:-0}" != 0 ]; then
              echo "::warning::The devops chat rejected the notice (code $code); the deploy result stands."
            fi
          fi
