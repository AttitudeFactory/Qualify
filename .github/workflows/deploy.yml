# Production deploy (CD) — docs/plan-sre-devops-produccion.md §5, punto 4.
#
#   images:  build deploy/Dockerfile `app`, `web` and `deploy-bundle` (the commit's deploy/
#            dir), plus packages/render (the Remotion render service), for ONE commit of main
#            and push them to GHCR as
#            ghcr.io/attitudefactory/qualify-{app,web,deploy,render}:<full sha> (GITHUB_TOKEN;
#            GHCR storage is free today, GitHub promises a month's notice before billing it).
#   deploy:  ssh to the server with a key that can ONLY run deploy/server-deploy.sh (forced
#            command) and only send `deploy <sha>`. The server pulls the images (render only
#            when its profile is on), takes the release's compose file and scripts from
#            qualify-deploy, runs `migrate`, then `up`. It never compiles. Then an external
#            smoke test.
#
# Inert until the founder sets it up (nothing here is invented):
#   secrets   QUALIFY_DEPLOY_SSH_KEY          private half of the restricted deploy key
#             QUALIFY_DEPLOY_SSH_TARGET       e.g. deploy@203.0.113.10
#             QUALIFY_DEPLOY_SSH_KNOWN_HOSTS  `ssh-keyscan -t ed25519 <ip>` output, verified
#             DEVOPS_WEBHOOK_URL              optional: deploy card in Lark Qualify-devs (job `notify`)
#             DEVOPS_WEBHOOK_SECRET           optional: the custom bot's signature secret
#   variable  QUALIFY_AUTO_DEPLOY             when to deploy on its own (manual always works):
#               merge (or true)  every push to main = every merge (the PR already passed `ci`)
#               daily            the tip of main once a day, only if it changed
#               anything else    never — manual runs only
#   server    /opt/qualify/bin/server-deploy.sh + authorized_keys line + `docker login ghcr.io`
#             (docs/despliegue-hetzner.md, "Deploy desde GitHub Actions")
#
# Why `daily` exists: on GitHub Free (2,000 min/month) a deploy costs ~8 billed minutes and
# October 2026 saw ~190 merges/month — per-merge deploys alone would eat the whole quota.
# The daily run ships whatever merged that day in one go, and skips when the tip of main
# already has images in GHCR (built = already deployed, or a failed deploy that a human must
# look at — retrying it every night would not help). In the mode that is off, the trigger
# still fires but `resolve` is skipped by its `if:` before any runner starts: zero minutes.
#
# Rollback: run this workflow by hand with an older sha of main (its images are still in
# GHCR). Across a migration, tick `skip_migrate`: the older image cannot run `alembic upgrade`
# on a newer database.
# Profiles (today only `render`) come from the server's .env.prod only (COMPOSE_PROFILES);
# qualify-render is built for every sha so turning the profile on needs no other change, and
# server-deploy.sh then pulls it and waits for it to be healthy. calendar-worker is no
# longer a profile (m-24828928): every deploy recreates it like the other workers.
name: deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit sha (or main) to deploy — must be on main"
        required: false
        default: main
      skip_migrate:
        description: "Rollback across a migration: skip `migrate` (the older code must run on the newer schema)"
        type: boolean
        required: false
        default: false
  push:
    branches: ["main"]
  schedule:
    # Daily 07:23 UTC = 03:23 Caracas — off the hour (GitHub delays on-the-hour crons), and
    # outside business hours, since `up` restarts the app containers for a few seconds.
    - cron: "23 7 * * *"

# One production deploy at a time, never cancelled half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Which commit, and whether to deploy it at all.
  resolve:
    # By hand, always; on its own, per QUALIFY_AUTO_DEPLOY (see the header).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (vars.QUALIFY_AUTO_DEPLOY == 'merge' || vars.QUALIFY_AUTO_DEPLOY == 'true')) ||
      (github.event_name == 'schedule' && vars.QUALIFY_AUTO_DEPLOY == 'daily')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read # the scheduled run asks GHCR whether the tip was already built
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      go: ${{ steps.sha.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      # Production runs reviewed code only: any commit of main (older ones = rollback, by
      # hand), never an unmerged branch. A per-merge run ships its push only while it is
      # still the tip (the concurrency group serializes without ordering, so an older commit
      # must never land on top of a newer one). The scheduled run ships the tip, and only
      # when GHCR has no image for it yet: images are pushed by this workflow alone, right
      # before deploying, so "already built" means "already deployed" (or a failed deploy
      # that needs a human, not a nightly retry). By hand it always goes.
      - id: sha
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main ||
            { echo "::error::$sha is not on main; only commits of main are deployed."; exit 1; }
          go=true
          if [ "$EVENT" = push ] && [ "$sha" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::$sha is no longer the tip of main; the deploy of the tip will ship it."
            go=false
          fi
          if [ "$EVENT" = schedule ]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
            if docker buildx imagetools inspect "ghcr.io/attitudefactory/qualify-app:$sha" >/dev/null 2>&1; then
              echo "::notice::$sha (tip of main) already has images in GHCR — nothing new to deploy."
              go=false
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  images:
    needs: resolve
    if: needs.resolve.outputs.go == 'true'
    # The production server is arm64 (aarch64): an amd64-only image fails `docker pull` with
    # "no matching manifest for linux/arm64/v8". Build natively on an arm64 runner (free tier
    # in private repos since 2026-01) instead of QEMU emulation, which is several times slower.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Own cache scope: ci/docker-deploy builds amd64 into `deploy`, so its layers never
      # match these arm64 ones.
      - name: Build and push qualify-app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: app
          platforms: linux/arm64
          push: true
          tags: ghcr.io/attitudefactory/qualify-app:${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=deploy-arm64
          cache-to: type=gha,scope=deploy-arm64,mode=max
      - name: Build and push qualify-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          platforms: linux/arm64
          push: true
          tags: ghcr.io/attitudefactory/qualify-web:${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=deploy-arm64
      - name: Build and push qualify-deploy (the commit's deploy/ dir)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: deploy-bundle
          platforms: linux/arm64
          push: true
          tags: ghcr.io/attitudefactory/qualify-deploy:${{ steps.sha.outputs.sha }}
      # Every sha gets its render image, whether or not the server runs the `render`
      # profile: a release must be able to start it the day COMPOSE_PROFILES enables it,
      # and a rollback must find it. Its own cache scope (render-arm64): ci/render fills
      # `render` with amd64 layers. Cached, it only re-tags (packages/render rarely changes);
      # cold — a Remotion bump — it reinstalls npm, Chrome Headless Shell and the bundle.
      - name: Build and push qualify-render (packages/render)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/render
          platforms: linux/arm64
          push: true
          tags: ghcr.io/attitudefactory/qualify-render:${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=render-arm64
          cache-to: type=gha,scope=render-arm64,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ needs.images.outputs.sha }}
      PUBLIC_URL: ${{ vars.QUALIFY_PUBLIC_URL || 'https://qualify.attitudefactory.co' }}
    steps:
      - name: Install the restricted deploy key
        env:
          KEY: ${{ secrets.QUALIFY_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.QUALIFY_DEPLOY_SSH_KNOWN_HOSTS }}
          TARGET: ${{ secrets.QUALIFY_DEPLOY_SSH_TARGET }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$TARGET" ]; then
            echo "::error::Deploy secrets are not configured (see the header of this workflow)."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy ${{ needs.images.outputs.sha }} (server pulls, migrates, starts)
        env:
          TARGET: ${{ secrets.QUALIFY_DEPLOY_SSH_TARGET }}
          ACTION: ${{ inputs.skip_migrate && 'rollback' || 'deploy' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes "$TARGET" "$ACTION" "$SHA" </dev/null
      - name: External smoke test
        run: |
          for probe in '/ping 200' '/login 200' '/api/connections/callback?code=x&state=x 303|403'; do
            path=${probe% *}; want=${probe##* }; got=""
            for _ in $(seq 1 10); do
              got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PUBLIC_URL$path" || true)
              case "|$want|" in *"|$got|"*) break ;; esac; sleep 3
            done
            echo "$PUBLIC_URL$path -> $got (want $want)"
            case "|$want|" in *"|$got|"*) ;; *) exit 1 ;; esac
          done
          echo "Deployed $SHA" >> "$GITHUB_STEP_SUMMARY"

  # Tell the Lark group Qualify-devs how every deploy that was attempted ended — one
  # interactive card: outcome, commit + PR + author, who triggered it, every stage with its
  # duration and the failed step, links. Built by .github/scripts/deploy_notify.py from the
  # job results plus the GitHub REST API (hence `actions: read`). Skipped when auto-deploy is
  # off and nothing was attempted. A missing webhook or an unreachable Lark never fails the
  # deploy: it is a notice, not a gate. Optional DEPLOY_EPIC_NOTIFICATIONS routes a separate
  # application-bot post to the Meegle Feature's chat (deploy_epics.py). No extra job or
  # trigger: normal API traffic adds seconds, within this job's existing 3-minute budget.
  # Lark answers HTTP 200 even when it rejects a message
  # (keyword / signature), so the script checks its `code` too.
  #   secret  DEVOPS_WEBHOOK_URL     the custom bot's webhook:
  #                                  https://open.larksuite.com/open-apis/bot/v2/hook/<token>
  #           DEVOPS_WEBHOOK_SECRET  optional: the bot's "signature verification" secret
  #                                  (every card title contains "Deploy" for the "custom
  #                                  keywords" option instead)
  notify:
    needs: [resolve, images, deploy]
    if: >-
      always() &&
      (needs.resolve.result == 'failure' || needs.resolve.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read # the commit's subject, author and PR
      actions: read # this run's jobs: durations and the failed step
      pull-requests: read # tickets mentioned in the deployed PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Notify Qualify-devs and the affected epic chats
        env:
          DEVOPS_WEBHOOK_URL: ${{ secrets.DEVOPS_WEBHOOK_URL }}
          DEVOPS_WEBHOOK_SECRET: ${{ secrets.DEVOPS_WEBHOOK_SECRET }}
          DEPLOY_EPIC_NOTIFICATIONS: ${{ vars.DEPLOY_EPIC_NOTIFICATIONS }}
          DEPLOY_EPIC_DRY_RUN: ${{ vars.DEPLOY_EPIC_DRY_RUN }}
          DEPLOY_MEEGLE_PLUGIN_ID: ${{ vars.DEPLOY_MEEGLE_PLUGIN_ID }}
          DEPLOY_MEEGLE_USER_KEY: ${{ vars.DEPLOY_MEEGLE_USER_KEY }}
          DEPLOY_MEEGLE_PLUGIN_SECRET: ${{ secrets.DEPLOY_MEEGLE_PLUGIN_SECRET }}
          DEPLOY_LARK_APP_ID: ${{ vars.DEPLOY_LARK_APP_ID }}
          DEPLOY_LARK_APP_SECRET: ${{ secrets.DEPLOY_LARK_APP_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          RESULT_RESOLVE: ${{ needs.resolve.result }}
          RESULT_IMAGES: ${{ needs.images.result }}
          RESULT_DEPLOY: ${{ needs.deploy.result }}
          SHA: ${{ needs.resolve.outputs.sha || inputs.ref || 'main' }}
          ACTION: ${{ inputs.skip_migrate && 'rollback (sin migrate)' || 'deploy' }}
          PUBLIC_URL: ${{ vars.QUALIFY_PUBLIC_URL || 'https://qualify.attitudefactory.co' }}
        run: python3 .github/scripts/deploy_notify.py
