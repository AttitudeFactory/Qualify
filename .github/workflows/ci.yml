# Qualify CI — the merge gate. Reproduce locally with `just ci-lint` / `just ci-test`
# (same commands as the steps below). What blocks vs. what only informs is documented in
# CLAUDE.md § "CI".
#
# Minutes matter (GitHub Free, 2,000 min/month on a private repo, and every job is billed
# rounded UP to the whole minute). Measured 2026-10-01..08: 1,658 billed minutes, ~6,000/month
# projected, most of it short jobs paying a full minute each. So (docs/plan-sre-devops-
# produccion.md, 2026-10-09):
#   - ONE job (`test`) does lint + offline tests + the migration gate + db tests: one runner
#     boot and one `uv sync` instead of four (`changes`, `lint`, `test`, `test-db`).
#   - Docker/Node checks live in workflows with `paths:` filters (images.yml, render.yml), so
#     a PR that does not touch their inputs starts no runner at all.
#   - Draft PRs run nothing; older runs of the same ref are cancelled.
#   - Secret scanning per PR is a gitleaks step over the PR's own commits (seconds); the full
#     history scan stays in security.yml (daily).
#
# Every third-party action is pinned to a commit SHA (the tag is kept in the comment so
# Dependabot can bump both).
name: ci

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push supersedes the running one, on main too: auto-deploy only ever ships the
  # tip of main (deploy.yml), and a cancelled run is simply not deployed.
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Make `uv run` refuse to re-resolve: the lock in the repo is the truth.
  UV_LOCKED: "1"
  # `setup-uv` installs the interpreter pinned in `.python-version` through uv itself.
  UV_PYTHON_DOWNLOADS: automatic
  GITLEAKS_VERSION: "8.30.1"

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # sticky coverage comment on the PR
    services:
      postgres:
        image: postgres:16
        env:
          # The root conftest.py refuses any DSN whose database does not end in `_test`.
          POSTGRES_DB: qualify_test
          POSTGRES_USER: qualify_owner
          POSTGRES_PASSWORD: ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U qualify_owner -d qualify_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Owner DSN for Alembic (migrations run as qualify_owner). App/admin/credential roles
      # are created by migration 0001/0002 with dev passwords, identical in CI and compose.
      QUALIFY_MIGRATION_DSN: postgresql+psycopg://qualify_owner:ci@localhost:5432/qualify_test
      QUALIFY_APP_DSN: postgresql+psycopg://qualify_app:app_dev@localhost:5432/qualify_test
      QUALIFY_ADMIN_DSN: postgresql+psycopg://qualify_admin:admin_dev@localhost:5432/qualify_test
      QUALIFY_CREDENTIAL_DSN: postgresql+psycopg://qualify_credential:credential_dev@localhost:5432/qualify_test
      QUALIFY_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's own commits for gitleaks; history is small, the fetch takes seconds.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked

      # --- lint (was the `lint` job). `github` format = inline annotations on the PR diff,
      # which replaces the reviewdog job that used to run in review.yml.
      - name: ruff check
        run: uv run ruff check . --output-format=github
      - name: ruff format --check
        run: uv run ruff format --check .

      # --- secrets in THIS PR's commits (BLOCKING). Full history: security.yml, daily.
      - name: gitleaks (PR commits only; FAILS on a real secret; output redacted)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "${base}/${tarball}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks git --no-banner --redact --exit-code 2 --config .gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      # --- offline unit tests: no Postgres/Redis, no vendors, no model weights. Default
      # groups only (backend + crm + dev) — the `ml`/torch group is NEVER installed in CI.
      - name: pytest (offline) with coverage
        run: >-
          uv run pytest -m "not integration and not db and not slow"
          --cov=packages/api/src --cov=packages/shared/src --cov=packages/scraper/src
          --cov=packages/creative/src --cov=Qualify
          --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered
      - name: Coverage summary (per package)
        if: always()
        run: |
          # If pytest aborted before writing `.coverage`, the script prints a fallback.
          uv run coverage json -o coverage.json || true
          uv run python .github/scripts/coverage_summary.py coverage.json > coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.json
            coverage-summary.md
          retention-days: 14
      - name: Post / refresh the coverage comment on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- qualify-coverage -->'
          { echo "$marker"; cat coverage-summary.md; } > comment.md
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@comment.md >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@comment.md >/dev/null
          fi

      # --- db tests + the reversibility gate (was the `test-db` job):
      # `alembic upgrade head` -> `downgrade base` -> `upgrade head` must land clean
      # (`just migrate-down` is a repo gate — ADR 27).
      - name: alembic upgrade head (fresh database)
        run: uv run alembic upgrade head
      - name: alembic downgrade base (reversibility gate)
        run: |
          uv run alembic downgrade base
          current=$(uv run alembic current 2>/dev/null | tr -d '[:space:]')
          if [ -n "$current" ]; then
            echo "::error::downgrade base left revision '$current' applied"; exit 1
          fi
      - name: alembic upgrade head (again, after downgrade)
        run: uv run alembic upgrade head
      - name: pytest -m db
        run: uv run pytest -m "db and not integration and not slow"
