name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Service containers give `db`-marked tests a real Postgres + Redis. No
    # `integration` tests run here — those hit paid/external vendors.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qualify
          POSTGRES_USER: qualify_owner
          POSTGRES_PASSWORD: ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U qualify_owner -d qualify"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      # Owner DSN for Alembic (migrations run as qualify_owner). App/admin roles are
      # created by migration 0001 with dev passwords, so those DSNs are identical in
      # CI and local compose.
      QUALIFY_MIGRATION_DSN: postgresql+psycopg://qualify_owner:ci@localhost:5432/qualify
      QUALIFY_APP_DSN: postgresql+psycopg://qualify_app:app_dev@localhost:5432/qualify
      QUALIFY_ADMIN_DSN: postgresql+psycopg://qualify_admin:admin_dev@localhost:5432/qualify
      QUALIFY_CREDENTIAL_DSN: postgresql+psycopg://qualify_credential:credential_dev@localhost:5432/qualify
      QUALIFY_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.13"
      # Default groups only (backend + crm + dev) — no torch in CI.
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Validates the migration (incl. RLS/roles) is reproducible against a fresh DB.
      - run: uv run alembic upgrade head
      - run: uv run pytest -m "not integration"
