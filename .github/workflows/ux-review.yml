# UX review of client-facing changes — automatic, suggestions only, never blocks.
#
# Runs Claude with the ux-designer agent definition (.claude/agents/ux-designer.md), the
# qualify-ux checklist and docs/perfil-cliente-pyme.md, and leaves ONE summary comment
# (marker `<!-- qualify-ux-review -->`, edited on re-runs) plus inline suggestions.
#
# COST (GitHub Free from 2026-11 = 2,000 min/month, billed per job rounded up):
#   - It lives in its own workflow so the `paths:` filter applies: a PR that touches no
#     client-facing file starts NO runner and costs 0 minutes. (Inside review.yml the
#     filter would also gate the on-demand `claude-review` label job.)
#   - Each run ≈ 2-4 billed minutes. Runs when a PR is opened, reopened or marked ready
#     for review, and when the label `ux-review` is added (remove + re-add for another
#     pass). 2026-09-23..10-23: 78 of 176 merged PRs touched these paths →
#     ~160-310 min/month.
#   - On every push (`synchronize`) only when the repo variable UX_REVIEW_ON_PUSH=true:
#     a skipped job costs 0 minutes; turned on, budget ~2-3x the figure above.
#
# SECRETS: same as review.yml (CLAUDE_CODE_OAUTH_TOKEN, else ANTHROPIC_API_KEY); without
# either the job ends green with a notice. Runbook: docs/calidad-codigo-revision-automatica.md

name: ux-review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
    branches: [main]
    # Client-facing paths: the Reflex screens, static assets, and backend sources of
    # text a client reads (message/reply templates, emails).
    paths:
      - "Qualify/**"
      - "assets/**"
      - "packages/api/src/qualify_api/**/templates.py"
      - "packages/api/src/qualify_api/replies/**"
      - "packages/api/src/qualify_api/auth/invite_email.py"
      - "packages/api/src/qualify_api/mail/**"

jobs:
  ux-review:
    name: Claude UX review
    if: >-
      github.event.pull_request.draft == false
      && github.actor != 'dependabot[bot]'
      && (
        contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action)
        || (github.event.action == 'labeled' && github.event.label.name == 'ux-review')
        || (github.event.action == 'synchronize' && vars.UX_REVIEW_ON_PUSH == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    concurrency:
      group: ux-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # The `secrets` context is unavailable in `if:`; presence flags go through env.
      HAS_CLAUDE_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Secrets missing → skip with notice
        if: env.HAS_CLAUDE_OAUTH != 'true' && env.HAS_ANTHROPIC_KEY != 'true'
        run: |
          msg="UX review skipped: neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set (Settings → Secrets → Actions). See docs/calidad-codigo-revision-automatica.md"
          echo "::notice::$msg"
          echo "> $msg" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        if: env.HAS_CLAUDE_OAUTH == 'true' || env.HAS_ANTHROPIC_KEY == 'true'
        with:
          fetch-depth: 1
      - name: UX review with Claude
        if: env.HAS_CLAUDE_OAUTH == 'true' || env.HAS_ANTHROPIC_KEY == 'true'
        # A Claude outage, an expired token or a rate limit must never block a PR.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model opus
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Eres el diseñador de experiencia (UX) de Qualify. La rama del PR ya está clonada
            en el directorio de trabajo. Antes de opinar, lee completos y sigue como tus
            instrucciones:
            1. `.claude/agents/ux-designer.md` (tu rol y tus reglas),
            2. `.claude/skills/qualify-ux/SKILL.md` (la lista de chequeo y el formato del informe),
            3. `docs/perfil-cliente-pyme.md` (quién es el usuario),
            4. `.claude/skills/qualify-copy-es/SKILL.md` (las reglas de redacción).

            Obtén el diff con `gh pr diff` y la descripción con `gh pr view`. Revisa
            ÚNICAMENTE lo que el PR cambia y que un cliente verá (pantallas, textos, mensajes,
            correos), con las lentes del agente en su orden: la persona, beneficios en vez de
            funcionalidades, cero palabras técnicas o en inglés («publicación», nunca «post»),
            pasos cortos de una decisión cada uno en vez de muchos campos en una sola vista, y
            accesibilidad y uso en el celular. Lee el archivo completo de la pantalla cuando
            necesites contexto.

            Cómo reportar (sugerencias, nunca bloqueos):
            - Para un texto o línea concreta, `mcp__github_inline_comment__create_inline_comment`
              (con `confirmed: true`), en español, con la cadena exacta que propones.
            - UN solo comentario de resumen que empiece con la línea
              `<!-- qualify-ux-review -->`, con el formato de `qualify-ux` §6 (máximo 8
              hallazgos ordenados, cada uno con archivo:línea, lo que sentiría el dueño del
              negocio y la mejora sugerida; para cambios de flujo, una maqueta ASCII corta).
              Antes de publicarlo, busca uno anterior con
              `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --paginate --jq '.[] | select(.body | startswith("<!-- qualify-ux-review -->")) | .id'`.
              Si existe, edítalo con
              `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -f body="..."`;
              si no, créalo con `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.
            - Si nada de lo cambiado lo ve un cliente, el resumen dice exactamente
              «Revisión de experiencia: sin sugerencias.».
            - Usa `gh api` solo para leer comentarios y editar tu propio comentario de
              resumen. No apruebes ni rechaces el PR, no pidas cambios formales, no comentes
              código ni estilo (eso es de `review.yml`), no modifiques archivos ni hagas commits.
