# Production-image check (was ci.yml `docker-deploy`): build deploy/Dockerfile's `web` and
# `app` targets and boot-test them. ~4-5 billed minutes per run, so it starts ONLY when a PR
# touches what the BUILD itself depends on (`paths:` below): the Dockerfile and deploy/, the
# dependency locks, the Reflex/bun lock and config. Plain code PRs (Qualify/**, packages/*/
# src/**, migrations/**) do not run it: their code is already exercised by ci.yml `test`,
# and the daily deploy.yml build is the backstop — a build that breaks there keeps the
# previous release live in production (server-deploy.sh never swaps a release it could not
# build/pull), so the cost of a miss is one day's delay, not an outage.
#
# Not on push to main: deploy.yml builds and pushes the real (arm64) images from main.
# `just merge` requires this check only when it reported.
name: images

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/images.yml'
      - 'deploy/**'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'packages/*/pyproject.toml'
      - 'rxconfig.py'
      - 'reflex.lock/**'
  workflow_dispatch:

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build the production images of deploy/Dockerfile (`web` = Caddy + `reflex export`,
  # `app` = the Python runtime) and boot-test them, so a broken Dockerfile or a page that
  # breaks the static export is caught before merge. Never pushed; layers cached in GHA.
  docker-deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build web (Caddy + static frontend)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          push: false
          load: true
          tags: qualify-web:ci
          cache-from: type=gha,scope=deploy
      - name: Build app (Python runtime)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: app
          push: false
          load: true
          tags: qualify-app:ci
          cache-from: type=gha,scope=deploy
          # One cache write per run, from the build that walks every stage `web` also uses
          # (deps, frontend-build); the Caddy stage itself is two COPYs.
          cache-to: type=gha,scope=deploy,mode=max
      - name: Smoke — the Reflex backend boots and answers /ping
        run: |
          docker run -d --name reflex -e QUALIFY_CALENDAR_WORKER=off \
            -e REFLEX_API_URL=http://localhost:8000 -e GRANIAN_WORKERS=1 \
            qualify-app:ci reflex run --env prod --backend-only --backend-port 8000
          for _ in $(seq 1 60); do
            if docker exec reflex python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping', timeout=2)" 2>/dev/null; then
              echo "reflex backend: /ping 200"; exit 0
            fi
            sleep 2
          done
          docker logs reflex; exit 1
      - name: Smoke — ffmpeg and ffprobe run in the app image (m-24957792)
        run: |
          # A one-frame H.264 + AAC encode proves the encoders the normalizers use, not just
          # that a binary exists.
          docker run --rm qualify-app:ci sh -c 'ffprobe -hide_banner -version >/dev/null \
            && ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=d=0.1 -f lavfi -i sine=d=0.1 \
               -c:v libx264 -c:a aac -f null -'
          echo "app image: ffmpeg (libx264 + aac) and ffprobe ok"
      - name: Validate both Caddyfiles (Qualify's internal router + the VPS edge proxy)
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" qualify-web:ci \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -e QUALIFY_DOMAIN=qualify.example.com -e PEDIDOS_DOMAIN=pedidos.example.com \
            -e EDGE_ACME_EMAIL=ci@example.com -v "$PWD/deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro" \
            qualify-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Smoke — Caddy serves the exported frontend
        run: |
          # Keep proxy/header checks isolated from business services and vendors.
          trap 'docker rm -f web static-smoke-upstream >/dev/null 2>&1 || true; docker network rm static-smoke >/dev/null 2>&1 || true' EXIT
          docker network create --internal static-smoke
          cat > "$RUNNER_TEMP/static-smoke-upstream.Caddyfile" <<'CADDY'
          :8000 {
            header Cache-Control "private, no-store"
            header X-Static-Smoke "upstream"
            respond "upstream" 200
          }
          CADDY
          docker run -d --name static-smoke-upstream --network static-smoke \
            --network-alias api --network-alias reflex \
            -v "$RUNNER_TEMP/static-smoke-upstream.Caddyfile:/etc/caddy/Caddyfile:ro" qualify-web:ci
          docker run -d --name web -e QUALIFY_DOMAIN=http://localhost \
            --network static-smoke -e QUALIFY_ACME_EMAIL=ci@example.com qualify-web:ci
          for path in / /login /drafts/abc; do
            code=""
            for _ in $(seq 1 15); do
              if docker exec web wget -q -O /dev/null "http://127.0.0.1$path"; then code=200; fi
              [ "$code" = 200 ] && break; sleep 1
            done
            echo "$path -> $code"; [ "$code" = 200 ] || { docker logs web; exit 1; }
          done
          # Reuse the exact Node image already pinned for frontend-build. No package
          # install, extra job or trigger; the checker only makes local GET requests.
          node_image=$(sed -n 's/^ARG NODE_IMAGE=//p' deploy/Dockerfile)
          docker run --rm --network static-smoke -v "$PWD/deploy:/checks:ro" "$node_image" \
            node /checks/check-static-http.mjs http://web --probe-upstream
