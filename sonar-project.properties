# SonarQube Cloud project configuration (read by SonarSource/sonarqube-scan-action in
# .github/workflows/sonar.yml; ADR 40, docs/adr-40-sonar-langfuse-gestionados.md).
#
# PLACEHOLDERS until the founder imports the repo into SonarQube Cloud: these are the keys
# SonarQube Cloud proposes by default when an organization is bound to the GitHub
# organization AttitudeFactory (organization key = lowercase GitHub org, project key =
# <GitHubOrg>_<repo>). If the import screen shows different keys, copy them here — the
# scan fails with "project not found" on a mismatch.
sonar.organization=attitudefactory
sonar.projectKey=AttitudeFactory_Qualify
sonar.projectName=Qualify
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Production sources: the uv workspace members' src trees + the Reflex app. qualify-models
# is deliberately out (ml group, not collected by the root pytest gate) and so is
# packages/render (Node/Remotion, no Python).
sonar.sources=packages/api/src,packages/shared/src,packages/scraper/src,packages/creative/src,Qualify
sonar.tests=packages/api/tests,packages/shared/tests,packages/scraper/tests,packages/creative/tests,Qualify

# Qualify/ holds app modules AND test_*.py side by side, so the split is by pattern:
# tests are only what matches test.inclusions; sources exclude exactly those patterns.
sonar.test.inclusions=**/tests/**,**/test_*.py,**/conftest.py
sonar.exclusions=**/tests/**,**/test_*.py,**/conftest.py,**/fixtures/**,**/.web/**,Qualify/assets/**,migrations/**,graphify-out/**,packages/render/node_modules/**,packages/render/out/**,**/node_modules/**,**/__pycache__/**

sonar.python.version=3.12
# Cobertura XML written by `pytest --cov ... --cov-report=xml:coverage.xml` (sonar.yml).
sonar.python.coverage.reportPaths=coverage.xml
# ruff findings as ruff's native JSON (`ruff check --output-format=json`), imported as
# external issues so the dashboard shows the same rules ci.yml enforces.
sonar.python.ruff.reportPaths=ruff-report.json

# v1: the quality gate is informative. Set to true to fail sonar.yml when it is red.
sonar.qualitygate.wait=false
