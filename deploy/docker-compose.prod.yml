# Qualify production stack for ONE host (Hetzner CX23/CX33, Ubuntu 24.04). Runbook (Spanish):
# docs/despliegue-hetzner.md. Always invoke with the server's env file, which provides
# both the ${...} interpolation below and the containers' runtime secrets — and migrate
# FIRST: `up` alone never runs `migrate` (own profile, not a dependency; see that service):
#
#   dc() { docker compose --env-file /opt/qualify/.env.prod -f deploy/docker-compose.prod.yml "$@"; }
#   dc build && dc run --rm -T migrate && dc up -d
#
# NOTHING in this stack publishes a port in production. The VPS edge proxy (deploy/edge/, its
# own compose in /opt/edge) owns 80/443, terminates TLS and reaches Qualify's `caddy` over the
# external network `qualify-edge` (alias `qualify-web`), so deploying Qualify never restarts the
# entry of the other products on this box. For a standalone run (local smoke) add
# deploy/docker-compose.standalone.yml, which publishes Caddy's :80. Postgres and Redis are
# reachable on the internal compose network only — never published, never reachable from the
# internet.
#
# Always on: caddy, api, reflex, postgres, redis, webhook-worker (QUA-147: settles recorded
# Meta webhooks; read-only toward Meta, never publishes), whatsapp-worker (WA-08: sends
# what was explicitly enqueued in `whatsapp_outbox`, nothing else) and conversations-worker
# (QUA-226: sends what a person approved in `conversation_outbox` and polls Instagram Direct),
# calendar-worker (QUA-111: publishes, at its time, what a person approved and scheduled
# in the Planificador) and creative-worker (ADR 41, m-24852163: the generation queue; sends
# to BytePlus only what an owner's request enqueued), connection-purge-worker
# (m-24789547: due explicit erasure, inactive until its role password is set),
# reels-worker (ADR 42 R8, m-24854855: the weekly «Ideas para tus reels» runs and the
# runs owners asked for; pays ScrapeCreators and Claude through the metered gate), and
# media-worker (ADR 47, m-24957794: prepares the Galería's videos with ffmpeg).
# `migrate` is a one-shot (below).
#
# Optional services, OFF unless their profile is enabled (COMPOSE_PROFILES in .env.prod):
#   render           Remotion render service (Node + headless Chrome, ~1 GB RAM under load;
#                    capped by mem_limit). CI publishes its image for every sha and
#                    server-deploy.sh waits for it to be healthy; enabling it needs the bigger
#                    server first (docs/despliegue-hetzner.md).

# Memory caps (m-24852229). The VPS has 3.8 GB shared with the edge proxy and other products, and
# before these caps no service but render had one: a runaway process could push the kernel
# into swap or make it OOM-kill Postgres. Each Python service gets mem_limit = memswap_limit
# (no swap for the container) at ~2.5-3x what `docker stats` measured on 2026-10-24, so a
# leak or a burst kills only that container and `restart: unless-stopped` brings it back.
# api gets the most: it runs generations inline today and downloads each vendor video
# whole into memory (creative/media.py, up to 200 MB) before uploading it to R2.
# postgres, redis and caddy stay uncapped on purpose (killing them is what the caps avoid);
# postgres also goes behind every container for the host OOM killer (oom_score_adj, m-24972741).
# The caps are ceilings, not reservations, and they overcommit: with media-worker (768m,
# m-24957794) the always-on Python services add up to ~4.75 GiB on a 3.8 GB box, before
# postgres/redis/caddy and the other products. That is a bet that they do not peak
# together (idle total ~1 GiB, measured 2026-10-24); ADR 47 reopens if free memory drops
# under 500 MB while media-worker transcodes.

name: ${COMPOSE_PROJECT_NAME:-qualify-prod}

# The Python image is BUILT by exactly one service (`api`, below); every other service
# that runs it only names it. When several services share one `image:` and each also has
# `build:`, Compose builds it once PER SERVICE, each copy stamped with its own
# `com.docker.compose.service` label, and whichever finishes last takes the tag — so the
# image ID flipped between deploys of an identical tree and Compose recreated api/reflex
# for nothing (the ~10 s of 502 measured 2026-10-06; docs/plan-sre-devops-produccion.md).
#
# QUALIFY_IMAGE_PREFIX / QUALIFY_IMAGE_TAG: empty/`latest` for images built ON the server
# (`just deploy`). A CI deploy (deploy/server-deploy.sh) writes `ghcr.io/attitudefactory/`
# and the commit sha to the release's deploy/release.env (pass it as a second --env-file),
# so the stack runs exactly the images CI built and pushed.
x-app-image: &app-image
  image: ${QUALIFY_IMAGE_PREFIX:-}qualify-app:${QUALIFY_IMAGE_TAG:-latest}

# Environment shared by every Python service. DSNs are ASSEMBLED here from the per-role
# passwords so a password lives in exactly one variable (and is rotated in one place).
# Passwords must be URL-safe (the docs generate them with `openssl rand -hex 24`).
x-app-env: &app-env
  QUALIFY_APP_DSN: postgresql+psycopg://qualify_app:${QUALIFY_DB_APP_PASSWORD:?set in .env.prod}@postgres:5432/qualify
  QUALIFY_ADMIN_DSN: postgresql+psycopg://qualify_admin:${QUALIFY_DB_ADMIN_PASSWORD:?set in .env.prod}@postgres:5432/qualify
  QUALIFY_CREDENTIAL_DSN: postgresql+psycopg://qualify_credential:${QUALIFY_DB_CREDENTIAL_PASSWORD:?set in .env.prod}@postgres:5432/qualify
  # Meta webhook intake (QUA-147, migration 0050): INSERT-only receiver + intake processor.
  QUALIFY_WEBHOOK_DSN: postgresql+psycopg://qualify_webhook:${QUALIFY_DB_WEBHOOK_PASSWORD:?set in .env.prod}@postgres:5432/qualify
  QUALIFY_WEBHOOK_WORKER_DSN: postgresql+psycopg://qualify_webhook_worker:${QUALIFY_DB_WEBHOOK_WORKER_PASSWORD:?set in .env.prod}@postgres:5432/qualify
  QUALIFY_REDIS_URL: redis://redis:6379/0
  # One public origin for everything (Caddy routes by path).
  QUALIFY_PUBLIC_MEDIA_BASE_URL: ${QUALIFY_PUBLIC_URL:?set in .env.prod}
  QUALIFY_META_REDIRECT_URI: ${QUALIFY_META_REDIRECT_URI:-${QUALIFY_PUBLIC_URL}/api/connections/callback}
  # TikTok (optional; empty key = off). Secret never has a default.
  TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
  TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
  TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-${QUALIFY_PUBLIC_URL}/api/connections/tiktok/callback}
  TIKTOK_ACCESS_POSTURE: ${TIKTOK_ACCESS_POSTURE:-development}
  # m-24947215: every host the app is served on (the edge's QUALIFY_DOMAIN + QUALIFY_EXTRA_HOSTS);
  # the host of QUALIFY_PUBLIC_URL is always added. A connect flow started on one of these
  # stays on it (callback + landing). TikTok has both callbacks registered; Meta only uses
  # the extra hosts listed in QUALIFY_META_REDIRECT_HOSTS, once registered in its app.
  QUALIFY_PUBLIC_HOSTS: ${QUALIFY_PUBLIC_HOSTS:-app.qualify.la}
  QUALIFY_META_REDIRECT_HOSTS: ${QUALIFY_META_REDIRECT_HOSTS:-}
  QUALIFY_RENDER_URL: http://render:3200
  REFLEX_API_URL: ${QUALIFY_PUBLIC_URL}
  REFLEX_DEPLOY_URL: ${QUALIFY_PUBLIC_URL}
  # Secrets whose CODE DEFAULT is a committed dev value (crypto.py, config.py): a missing
  # one would not fail — it would silently run production on the dev key. Re-stating them
  # with `:?` makes `docker compose` refuse to start instead.
  QUALIFY_DEV_FERNET_KEY: ${QUALIFY_DEV_FERNET_KEY:?set in .env.prod (credential master key)}
  QUALIFY_OAUTH_STATE_SECRET: ${QUALIFY_OAUTH_STATE_SECRET:?set in .env.prod}
  QUALIFY_META_APP_ID: ${QUALIFY_META_APP_ID:?set in .env.prod}
  QUALIFY_META_APP_SECRET: ${QUALIFY_META_APP_SECRET:?set in .env.prod}
  QUALIFY_SUPABASE_URL: ${QUALIFY_SUPABASE_URL:?set in .env.prod}
  QUALIFY_SUPABASE_PUBLISHABLE_KEY: ${QUALIFY_SUPABASE_PUBLISHABLE_KEY:?set in .env.prod}
  # Dev-only escape hatches, forced empty whatever the env file says.
  QUALIFY_AUTH_FAKE: ""
  QUALIFY_AUTH_FAKE_STATE_PATH: ""
  QUALIFY_MAIL_FAKE: ""
  # Signup is invite-only (`just invite`); this dev hatch must never open it in production.
  QUALIFY_SIGNUP_OPEN: ""
  # m-24852203: the inbox's Meta read simulator is dev-only. Forced off here, and the
  # production marker below makes `qualify_api.inbox.simulator` refuse it outright.
  QUALIFY_META_READS: ""
  QUALIFY_META_READS_FIXTURE: ""
  # m-24955929: the E2E's fake bucket and fake copy (both refuse production anyway).
  QUALIFY_OBJECT_STORE_DIR: ""
  QUALIFY_COPY_FAKE: ""
  QUALIFY_DEPLOY_ENV: production
  # `env_file` hands the WHOLE .env.prod to every app container; blank the raw database
  # passwords there. Serving processes only need the per-role DSNs above — and the owner
  # password in particular is a superuser that bypasses RLS, which none of them may hold.
  # (`migrate` re-adds exactly what it needs.)
  QUALIFY_DB_OWNER_PASSWORD: ""
  QUALIFY_DB_APP_PASSWORD: ""
  QUALIFY_DB_ADMIN_PASSWORD: ""
  QUALIFY_DB_CREDENTIAL_PASSWORD: ""
  QUALIFY_DB_WEBHOOK_PASSWORD: ""
  QUALIFY_DB_WEBHOOK_WORKER_PASSWORD: ""
  QUALIFY_DB_CREATIVE_WORKER_PASSWORD: ""
  QUALIFY_DB_REELS_WORKER_PASSWORD: ""
  QUALIFY_DB_CONNECTION_PURGE_PASSWORD: ""
  # Dedicated DELETE authority is operator-only, never inherited by serving processes.
  QUALIFY_CONNECTION_PURGE_DSN: ""

x-app-env-file: &app-env-file
  env_file:
    - path: ${QUALIFY_ENV_FILE:-/opt/qualify/.env.prod}
      required: true

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: qualify
      # The owner role IS the bootstrap superuser of this container, exactly like the dev
      # compose: migrations run as it, the app never does (it uses the three roles below).
      POSTGRES_USER: qualify_owner
      POSTGRES_PASSWORD: ${QUALIFY_DB_OWNER_PASSWORD:?set in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qualify_owner -d qualify"]
      interval: 5s
      timeout: 3s
      retries: 30
    shm_size: 256m
    # m-24972741: protect Postgres when the HOST runs out of memory. Still no mem_limit (see
    # «Memory caps» at the top: a cap would make the kernel kill the one service the caps
    # protect). The VPS is a 3805 MiB arm64 box shared with other products, and Qualify's caps
    # already overcommit it: the always-on Python caps add up to 4864 MiB (5120 once
    # creative-worker goes to 768m, VE-10a). Measured 2026-11-06: 1380 MiB available idle,
    # ~530 MiB at a transcode + part-join peak. If the box does run out, the kernel OOM killer
    # must pick another container (they all sit at 0 and restart on their own) first.
    # oom_score_adj: -400 (range -1000..1000) puts it behind every container at 0 but still
    # ahead of dockerd (-500) and containerd (-999): losing the daemon would cut every product
    # on the box. -900/-1000 are avoided (-1000 would forbid the kill entirely): Docker docs,
    # «Resource constraints» › «Understand the risks of running out of memory»
    # (https://docs.docker.com/engine/containers/resource_constraints/): "You shouldn't try
    # to circumvent these safeguards by manually setting --oom-score-adj to an extreme
    # negative number" on the daemon or a container.
    oom_score_adj: -400
    # mem_reservation: a soft floor, not a cap (cgroup v2 memory.low): under host memory
    # pressure the kernel reclaims page cache from other cgroups before going under it.
    # It may have NO effect: v2 only honours it as far as the parent slice (system.slice)
    # has a MemoryLow too, and the server sets none (docs/despliegue-hetzner.md §1.2).
    # Applying either key recreates postgres.
    mem_reservation: 256m
    <<: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # OAuth state, refresh locks, media tokens: short-lived by design, but an RDB snapshot
    # keeps an in-flight OAuth round trip alive across a container restart.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    <<: *logging

  # One-shot: schema (Alembic, as qualify_owner) + production role passwords. Run as an
  # explicit step BEFORE `up` (deploy/deploy.sh):
  #
  #   docker compose ... run --rm migrate && docker compose ... up -d
  #
  # It used to be a `depends_on: service_completed_successfully` of api/reflex, which tied
  # their lifecycle to a one-shot: anything that recreated migrate (its env, its image)
  # recreated them too. The `migrate` profile keeps a bare `up` from starting it; `run`
  # does not need the profile enabled. A failed migration still never serves traffic:
  # deploy.sh stops before `up`.
  migrate:
    <<: [*app-image, *app-env-file, *logging]
    profiles: ["migrate"]
    restart: "no"
    environment:
      <<: *app-env
      QUALIFY_MIGRATION_DSN: postgresql+psycopg://qualify_owner:${QUALIFY_DB_OWNER_PASSWORD}@postgres:5432/qualify
      # bootstrap_db_roles.py sets these on the application roles (blanked in every other
      # service).
      QUALIFY_DB_APP_PASSWORD: ${QUALIFY_DB_APP_PASSWORD}
      QUALIFY_DB_ADMIN_PASSWORD: ${QUALIFY_DB_ADMIN_PASSWORD}
      QUALIFY_DB_CREDENTIAL_PASSWORD: ${QUALIFY_DB_CREDENTIAL_PASSWORD}
      QUALIFY_DB_WEBHOOK_PASSWORD: ${QUALIFY_DB_WEBHOOK_PASSWORD}
      QUALIFY_DB_WEBHOOK_WORKER_PASSWORD: ${QUALIFY_DB_WEBHOOK_WORKER_PASSWORD}
      # Optional until creative-worker ships (ADR 41): unset -> the role stays NOLOGIN.
      QUALIFY_DB_CREATIVE_WORKER_PASSWORD: ${QUALIFY_DB_CREATIVE_WORKER_PASSWORD:-}
      # reels-worker's door (ADR 42 R8, 0119/0134): unset -> the role stays NOLOGIN and
      # the worker starts no run (it logs `reels.worker.*_failed` once a minute).
      QUALIFY_DB_REELS_WORKER_PASSWORD: ${QUALIFY_DB_REELS_WORKER_PASSWORD:-}
      QUALIFY_DB_CONNECTION_PURGE_PASSWORD: ${QUALIFY_DB_CONNECTION_PURGE_PASSWORD:-}
    command:
      - sh
      - -c
      # platform_app: registers QUALIFY_META_APP_ID in `platform_apps` (idempotent). Without
      # that row every OAuth callback 500s with PlatformAppMissing; the seed that used to
      # create it never runs in production. After bootstrap: it connects as qualify_admin.
      - >-
        alembic upgrade head && python deploy/bootstrap_db_roles.py
        && python -m qualify_api.connections.platform_app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: [*app-image, *app-env-file, *logging]
    # The only `build:` of qualify-app (see x-app-image).
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    restart: unless-stopped
    # m-24852229: 102 MiB measured idle 2026-10-24; see «Memory caps» at the top.
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      <<: *app-env
    command:
      - uvicorn
      - --factory
      - qualify_api.http.app:create_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    volumes:
      - uploads:/data/uploaded_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  reflex:
    <<: [*app-image, *app-env-file, *logging]
    restart: unless-stopped
    # m-24852229: 183 MiB measured idle 2026-10-24; see «Memory caps» at the top.
    # m-24957792: 768m since the catalog's product clips are normalized here with ffmpeg
    # (threads capped): ~260 MiB measured in prod 2026-11-06 + ~245 MiB ffmpeg peak.
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      <<: *app-env
      # The embedded calendar worker (QUA-111) is FORCED off here: publishing runs in the
      # dedicated `calendar-worker` service, and a second copy inside the UI process would
      # only add load to the one Reflex worker.
      QUALIFY_CALENDAR_WORKER: "off"
      # One worker process with Reflex's default (disk) state manager. Per-tab state —
      # including the login, which lives only in backend state (Qualify/auth_state.py) — is
      # pickled to /app/.states, kept on a volume so a deploy does not log everyone out.
      # Scaling past one worker needs REFLEX_REDIS_URL (shared state) first.
      GRANIAN_WORKERS: "1"
    command: ["reflex", "run", "--env", "prod", "--backend-only", "--backend-port", "8000"]
    volumes:
      - uploads:/data/uploaded_files
      - avatars:/data/avatars
      - reflex_states:/app/.states
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  caddy:
    image: ${QUALIFY_IMAGE_PREFIX:-}qualify-web:${QUALIFY_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        QUALIFY_PUBLIC_URL: ${QUALIFY_PUBLIC_URL}
        # m-24946266: same-origin backend URL (deploy/Dockerfile, frontend-build).
        QUALIFY_FRONTEND_API_URL: ${QUALIFY_FRONTEND_API_URL:-http://0.0.0.0}
    restart: unless-stopped
    # No `ports:` — the edge proxy (deploy/edge/) is the only listener on 80/443. Caddy here
    # serves plain HTTP on :80 inside the networks below; `caddy_data` is kept (unused since
    # TLS moved to the edge) only so its certificates can seed the edge's volume.
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # `edge` = the external network `qualify-edge`, created by deploy/edge/install.sh. The alias
    # is the upstream name in deploy/edge/Caddyfile.
    networks:
      default: {}
      edge:
        aliases:
          - qualify-web
    depends_on:
      api:
        condition: service_started
      reflex:
        condition: service_started
    <<: *logging

  # QUA-147 Meta webhook intake processor. Settles what `POST /api/mentions/webhook`
  # recorded: mentions -> tenant resolution + ingest (one read-only Graph call each);
  # every other field, comments included, is kept as `unsupported`. Deliberately NOT
  # behind a profile: it never publishes, replies or writes to Meta, and without it every
  # mention the receiver records stays `pending` forever. Also runs the 29-day retention
  # purge once at start and every 24 h. Several instances at once are safe
  # (FOR UPDATE SKIP LOCKED), but one is enough.
  webhook-worker:
    <<: [*app-image, *app-env-file, *logging]
    restart: unless-stopped
    # m-24852229: 84 MiB measured idle 2026-10-24; see «Memory caps» at the top.
    # m-24852538: raised 256m -> 320m for the Alta prefill (PB-4) that runs in this loop.
    # Measured under the cap with `just mem-webhook-worker` (deploy/measure/): peak RSS
    # 135 MiB idle and after a 100-change batch, 188 MiB after one prefill with a
    # 1080 px picture (cgroup peak up to 197 MiB = 77 % of 256m), 249 MiB with a 2048 px
    # picture (97 %: one larger CDN picture from an OOM kill). 320m keeps >= 20 % over
    # that worst case. NOT covered by any cap this size: robertuito (the comment-analysis
    # sweep of the same loop) peaks at ~900 MiB — see the m-24852538 PR.
    mem_limit: 320m
    memswap_limit: 320m
    environment:
      <<: *app-env
    command:
      - python
      - -m
      - qualify_api.webhooks.worker
      - --interval
      - ${QUALIFY_WEBHOOK_WORKER_INTERVAL:-5}
    depends_on:
      postgres:
        condition: service_healthy

  # WA-08 WhatsApp outbox sender. Drains `whatsapp_outbox` (the replies people write in
  # /whatsapp, what the menu engine answers, later campaigns): claim -> 24 h window ->
  # pacing -> send -> settle, as qualify_app under tenant_session. Always on, like
  # webhook-worker: without it nothing a person or the bot says ever leaves Qualify. It
  # sends only what was explicitly enqueued — never on its own initiative — so a deploy
  # that starts it is not a deploy that starts talking. Several instances at once are safe
  # (FOR UPDATE SKIP LOCKED), but one is enough.
  whatsapp-worker:
    <<: [*app-image, *app-env-file, *logging]
    restart: unless-stopped
    # m-24852229: 69 MiB measured idle 2026-10-24; see «Memory caps» at the top.
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      <<: *app-env
    command:
      - python
      - -m
      - qualify_api.whatsapp.worker
      - --all-tenants
      - --interval
      - ${QUALIFY_WHATSAPP_WORKER_INTERVAL:-5}
    depends_on:
      postgres:
        condition: service_healthy

  # QUA-226 Conversaciones (Instagram Direct). Drains `conversation_outbox` — only what a
  # person approved in /conversations (the approver is a NOT NULL column) — and, with
  # `--sync`, reconciles each connected Instagram account against Meta every
  # QUALIFY_CONVERSATIONS_SYNC_INTERVAL seconds (threads, messages, the counterpart's
  # profile). Always on, like whatsapp-worker: without it nothing a person writes leaves
  # Qualify and nothing arrives between webhooks. Never sends on its own initiative.
  # Several instances are safe (FOR UPDATE SKIP LOCKED), one is enough. After each send it
  # also posts the public notices of Fase C (m-24789646) — only those a person approved,
  # only after the private message is confirmed sent, and only with QUALIFY_PUBLIC_NOTICE=on.
  conversations-worker:
    <<: [*app-image, *app-env-file, *logging]
    restart: unless-stopped
    # m-24852229: 79 MiB measured idle 2026-10-24; see «Memory caps» at the top.
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      <<: *app-env
    command:
      - python
      - -m
      - qualify_api.conversations.worker
      - --all-tenants
      - --sync
      - --interval
      - ${QUALIFY_CONVERSATIONS_WORKER_INTERVAL:-5}
      - --sync-interval
      - ${QUALIFY_CONVERSATIONS_SYNC_INTERVAL:-300}
    depends_on:
      postgres:
        condition: service_healthy

  # QUA-111 calendar executor. PUBLISHES FOR REAL to connected accounts — but only what a
  # person approved and scheduled in the Planificador (an event must be `scheduled` AND
  # approved), never on its own initiative, so like whatsapp-worker it is always on. It was
  # behind an opt-in profile until 2026-10-21 (m-24828928); nobody ever enabled it on the
  # server, so no scheduled post was ever published in production. On start the first tick
  # publishes whatever approved event is overdue but still inside the 24 h execution window
  # (planner/rules.py EXECUTION_WINDOW); older ones expire instead of publishing late.
  # Several instances at once are safe (claim CAS, advisory locks, idempotency key), one is
  # enough. Every tick leaves a heartbeat in Redis that the Planificador reads (QUA-118).
  # m-24828907: it also runs the piece purge at start and every 24 h (R2 files of pieces
  # 90 days past their last use) — FOR REAL, as the ticket asks. Kill switch:
  # QUALIFY_PIECE_PURGE_EXECUTE=0 in .env.prod makes it log only. R2 settings come from the
  # env file.
  calendar-worker:
    <<: [*app-image, *app-env-file, *logging]
    restart: unless-stopped
    # m-24852229: 107 MiB measured idle 2026-10-24; see «Memory caps» at the top.
    mem_limit: 320m
    memswap_limit: 320m
    environment:
      <<: *app-env
      QUALIFY_PIECE_PURGE_EXECUTE: ${QUALIFY_PIECE_PURGE_EXECUTE:-1}
      # m-24852163: the recovery of billed BytePlus videos (m-24852492) moved to
      # creative-worker; forced off here so exactly one service runs it.
      QUALIFY_CALENDAR_VENDOR_RECOVERY: "off"
    command:
      - python
      - -m
      - qualify_api.planner.worker
      - ${QUALIFY_CALENDAR_WORKER_SCOPE:---all-tenants}
      # The CLI worker takes its cadence from argv (the env var only configures the
      # embedded worker), so it is passed through explicitly.
      - --interval
      - ${QUALIFY_CALENDAR_WORKER_INTERVAL:-60}
    volumes:
      - uploads:/data/uploaded_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Explicit support command: dry-run unless --execute, always tenant scoped.
  # dc run --rm -T connection-purge --tenant UUID [--connection UUID] [--request] --execute
  connection-purge:
    <<: [*app-image, *app-env-file, *logging]
    profiles: ["connection-purge"]
    restart: "no"
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      <<: *app-env
      QUALIFY_CONNECTION_PURGE_DSN: postgresql+psycopg://qualify_connection_purge:${QUALIFY_DB_CONNECTION_PURGE_PASSWORD:-}@postgres:5432/qualify
    entrypoint: ["python", "-m", "qualify_api.connections.purge_cli"]
    command: ["--help"]
    depends_on:
      postgres:
        condition: service_healthy

  # m-24789547: always present so explicit disconnect/manual requests are not stranded.
  # Only the dedicated NOBYPASSRLS purge door is available; 0108 discovers due tenant
  # IDs without giving this process an admin role or cross-tenant table access.
  # Missing optional password => one inactive warning and a fresh inactive heartbeat,
  # no login attempts/restart flood. Stage the role password and deploy to activate.
  connection-purge-worker:
    <<: [*app-image, *app-env-file, *logging]
    restart: unless-stopped
    stop_grace_period: 5m
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      <<: *app-env
      QUALIFY_APP_DSN: ""
      QUALIFY_ADMIN_DSN: ""
      QUALIFY_CREDENTIAL_DSN: ""
      QUALIFY_WEBHOOK_DSN: ""
      QUALIFY_WEBHOOK_WORKER_DSN: ""
      QUALIFY_CREATIVE_WORKER_DSN: ""
      QUALIFY_CONNECTION_PURGE_DSN: postgresql+psycopg://qualify_connection_purge:${QUALIFY_DB_CONNECTION_PURGE_PASSWORD:-}@postgres:5432/qualify
    command: ["python", "-m", "qualify_api.connections.purge_worker", "--all-tenants", "--execute"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "qualify_api.connections.purge_worker", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 1
      start_period: 30s

  # m-24828978 / m-24828979: Meta GET observations only; no publishing or ad writes.
  # Default OFF: verify host headroom before setting QUALIFY_ADS_READ_WORKER_REPLICAS=1.
  # Activation procedure: deploy/ads-reads-worker.md. Existing credentials are reused.
  ads-reads-worker:
    <<: [*app-image, *app-env-file, *logging]
    deploy:
      replicas: ${QUALIFY_ADS_READ_WORKER_REPLICAS:-0}
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      <<: *app-env
      QUALIFY_WEBHOOK_DSN: ""
      QUALIFY_WEBHOOK_WORKER_DSN: ""
      QUALIFY_CREATIVE_WORKER_DSN: ""
      QUALIFY_REELS_WORKER_DSN: ""
    command: ["python", "-m", "qualify_api.ads.reads_cli", "--all-tenants", "--interval", "60", "--limit", "100"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "qualify_api.ads.reads_cli", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 30s

  # ADR 41 / m-24852163 generation queue worker. Drains `creative_jobs` with a cap of
  # QUALIFY_VENDOR_POOLS tasks at once per BytePlus pool (Seedance 10, OmniHuman 1 by
  # default), lanes now > final > standard > scheduled, 3 slots reserved for now/final,
  # at most 2 per business, aging after 15 min. It only sends what an owner's request
  # enqueued (never on its own initiative) and every final still waits for the owner's
  # confirmation before it can be published (ADR 41 §3). It also runs the recovery of
  # billed BytePlus videos (m-24852492, moved from calendar-worker) every 60 s.
  # Always on, like the other workers (a profile is how calendar-worker stayed off for
  # weeks, m-24828928). Until QUALIFY_DB_CREATIVE_WORKER_PASSWORD is set in .env.prod the
  # role is NOLOGIN: the queue loop logs `creative.worker.queue_door_unavailable` once a
  # minute and the recovery keeps running — no crash loop. Several instances are safe
  # (advisory lock per pool + SKIP LOCKED + claim token), one is enough.
  # mem_limit 512m (platform-engineer verdict, 2026-10-24): at most
  # QUALIFY_CREATIVE_WORKER_DOWNLOADS (2, max 3) vendor videos download at once, streamed
  # to a temporary file, apart from the 10 vendor slots.
  # Raised to 768m (Deivid, 2026-11-06, VE-10a m-24921067): the worker now also joins the
  # previews of a video's parts locally (PyAV). Measured with
  # deploy/measure/creative-worker-memory.sh, 6 parts 1080p x 10 s joined at 480x854, on
  # native amd64: the join uses ~200 MiB of its own (anon) plus up to 142 MiB of page cache
  # from its temporary files; re-measured under 768m with the brand logo overlaid on the
  # join, the whole-process peak was 442 MiB (58 %) and a fresh worker doing only the join
  # 386 MiB (50 %), both under the 60 % bar (461 MiB). Emulated arm64 (QEMU) inflates those figures;
  # native arm64, as production, was not measured. VE-10b's 1080p final join must be
  # re-measured against 768m before it ships. memswap_limit stays equal (no swap).
  creative-worker:
    <<: [*app-image, *app-env-file, *logging]
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      <<: *app-env
      # Assembled here only (the other services never hold this role). `:-` and not `:?`:
      # compose interpolates the whole file, so a `:?` would stop every deploy until the
      # founder sets the password.
      QUALIFY_CREATIVE_WORKER_DSN: postgresql+psycopg://qualify_creative_worker:${QUALIFY_DB_CREATIVE_WORKER_PASSWORD:-}@postgres:5432/qualify
      QUALIFY_VENDOR_POOLS: ${QUALIFY_VENDOR_POOLS:-}
      QUALIFY_CREATIVE_WORKER_DOWNLOADS: ${QUALIFY_CREATIVE_WORKER_DOWNLOADS:-2}
    command:
      - python
      - -m
      - qualify_api.creative.worker
      - --all-tenants
      - --interval
      - ${QUALIFY_CREATIVE_WORKER_INTERVAL:-2}
    volumes:
      - uploads:/data/uploaded_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ADR 42 R8 / m-24854855 reels worker («Ideas para tus reels»). Every Monday from 06:00
  # in each business's timezone (for 24 h) it enqueues the weekly run of every brand whose
  # owner opened the screen in the 14 days before and that has a brief and accounts to
  # read, and it runs the queued runs one at a time (runs someone asks for — R9, later —
  # before the weekly ones). A run PAYS ScrapeCreators credits and Claude. What bounds the
  # spend: one attempt reads at most ~88 credits (12 accounts x 4 pages + 40 transcripts);
  # an attempt done again re-reads no account read in the last 24 h / 72 h and never pays
  # a transcript or a verdict twice; every paid read is booked to the run's business
  # before it leaves and held to its caps (ADR 42 R5: 150 credits a local day, 600 a local
  # month, the operator's 90-day run too: a refused read ends the run budget_stopped); and
  # the metered gate's switch (QUALIFY_SCRAPECREATORS_PAID=0: a run reads nothing and ends
  # budget_stopped), its 500-credit floor and its stop on a 402.
  # It picks the next run through its own door, `qualify_reels_worker` (SELECT of a few
  # columns of the businesses' tables, migration 0134 — every write about a business goes
  # through qualify_app; it writes only the global analysis tables of 0119). Until
  # QUALIFY_DB_REELS_WORKER_PASSWORD is set in .env.prod that role is NOLOGIN: each pass
  # logs `reels.worker.*_failed` (once a minute) and no run starts — no crash loop.
  # stop_grace_period 120s: on SIGTERM the run in flight goes back to the queue — at once
  # during the Claude check (answers in flight are stored when they arrive), after the
  # transcripts in flight (at most 2 x 45 s) during that step. One cut by a SIGKILL goes
  # back to the queue after 30 min (error after 3 attempts). Run ONE instance: a second
  # never runs the same attempt twice (compare-and-set claim, fenced writes), but it could
  # take back after 30 min a run the first is still working on.
  # Once a run ends ok its ideas go to the shared analysis of ADR 44 (VE-04a,
  # `analyze_run_ideas`; founder, 2026-11-04: «Replicar» works all week): each idea's video
  # is downloaded from the CDN (free) while its link is fresh, at most 80 MiB, to a
  # temporary file on the container's disk, remuxed with PyAV (<= 60 s, no audio, no
  # re-encode) and stored under public/reel-analyses/ with the QUALIFY_R2_* of the env file
  # (no new secret). Every pass also drains that queue (`drain_once`, as `just
  # reel-analysis-tick`): what a business asked for and what is left to download. Until
  # VE-04c it calls no model and no ScrapeCreators: it downloads and stores only. The
  # sources are deleted 30 days later (the date is on the row before the upload), at start
  # and daily: QUALIFY_REEL_PURGE_EXECUTE "1" deletes for real (anything else only reports).
  # mem_limit 384m: measured 2026-11-04 on Linux (the deps image, arm64, Python 3.12,
  # PyAV 19, --network none) with a synthetic 60 s 1080x1920 30 fps reel (34.7 MiB): the
  # process with everything the worker imports sits at ~150 MiB; download + remux + a real
  # boto3 PUT (to a local sink) adds ~19 MiB on the first reel and levels off at +31 MiB
  # after 9 (peak 181 MiB, ~1.3 s per reel). The rest is headroom for a run (Claude and
  # ScrapeCreators clients, not re-measured here); platform-engineer confirms it on the VPS
  # with `docker stats` after the first real runs.
  reels-worker:
    <<: [*app-image, *app-env-file, *logging]
    restart: unless-stopped
    stop_grace_period: 120s
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      <<: *app-env
      # Assembled here only (the other services never hold this role). `:-` and not `:?`:
      # compose interpolates the whole file, so a `:?` would stop every deploy until the
      # founder sets the password.
      QUALIFY_REELS_WORKER_DSN: postgresql+psycopg://qualify_reels_worker:${QUALIFY_DB_REELS_WORKER_PASSWORD:-}@postgres:5432/qualify
      # ADR 44 F9 (VE-12): the 30-day purge of the stored reel sources deletes for real.
      QUALIFY_REEL_PURGE_EXECUTE: "1"
      # m-25026378 (D3, founder 2026-11-14): the weekly TikTok hashtag read runs inside this
      # worker (checked every 6 h, last in its pass; each business is still read at most
      # once a week), ONLY for the pilot businesses listed below
      # (tenant UUIDs, commas; `qualify_api.hashtags.pilot`). A listed business is read even
      # if it never opened «Ideas para tus reels». EMPTY = NOBODY is read, even with the
      # switch on (fail closed): deploying with it empty pays nothing. Each business pays at
      # most 5 credits in any 7 days (25 a month), charged to its own caps; the gate's
      # QUALIFY_SCRAPECREATORS_PAID=0 stops it too. Set here, not in .env.prod: these values
      # override the env file. `python -m qualify_api.hashtags.worker --all-tenants` run by hand
      # here reads this same list. Widening it beyond a pilot is a later decision.
      QUALIFY_HASHTAG_WEEKLY_READ: "1"
      QUALIFY_HASHTAG_WEEKLY_TENANTS: ""
    command:
      - python
      - -m
      - qualify_api.referentes.worker
      - --all-tenants
      - --interval
      - ${QUALIFY_REELS_WORKER_INTERVAL:-5}
    depends_on:
      postgres:
        condition: service_healthy

  # m-24957794 (ADR 47 §4.3, founder approved the service 2026-11-05, D8): the Galería's
  # media-worker (qualify_api.catalog.media_worker, m-24955918) — one job at a time in the
  # whole server: ffprobe → ffmpeg (H.264 + AAC, ≤1080×1920, first 60 s) of the video Reflex
  # staged on the `uploads` volume, then R2; plus the daily R2 reconciler. ffmpeg comes with
  # the app image (m-24957792). cpus 1.0 + 768m: ~100 MiB idle [H]; ffmpeg alone, for a
  # 60 s 1080×1920 H.264 + AAC transcode with -threads 2, was OOM-killed at 512m and finished
  # at 640m, in ~3 min on 1 CPU (local arm64, 2026-11-06): ~130 MiB of headroom for Python.
  # The CPU cap keeps it off the other cores; memory overcommits
  # (see «Memory caps» at the top). No healthcheck: the CLI has no probe (only
  # connection-purge-worker's does); restart policy as every worker.
  # A deploy sends SIGTERM: the loop stops after the current job. 4m covers a 60 s video's
  # ~3 min transcode, so a deploy rarely kills one (it would cost one of its 3 attempts;
  # the job is reclaimed when its 10-minute lease expires). Worst case a deploy waits 4 min.
  media-worker:
    <<: [*app-image, *app-env-file, *logging]
    restart: unless-stopped
    stop_grace_period: 4m
    cpus: 1.0
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      <<: *app-env
      REFLEX_UPLOADED_FILES_DIR: /data/uploaded_files
    command:
      - python
      - -m
      - qualify_api.catalog.media_worker
      - --all-tenants
      - --interval
      - ${QUALIFY_MEDIA_WORKER_INTERVAL:-5}
    volumes:
      - uploads:/data/uploaded_files
    depends_on:
      postgres:
        condition: service_healthy

  # --- optional -------------------------------------------------------------------------

  # Remotion render service (packages/render). Needed only by the template generator.
  # `build:` serves `just deploy` (builds on the server); a CI release passes --no-build and
  # runs ghcr.io/attitudefactory/qualify-render:<sha> through deploy/release.env, like app/web.
  # mem_limit: Chromium takes ~1 GB per render (RENDER_CONCURRENCY 1) plus Node; the cap makes
  # a runaway render get OOM-killed inside this container (restart: unless-stopped brings it
  # back) instead of pushing the kernel to kill Postgres or the app.
  # healthcheck (m-25017289): the same /health criterion as the image's HEALTHCHECK and the
  # sticker path (`ok` and `bundleReady`), at a calmer cadence than the image's 5 s once up.
  # Docker does NOT restart an `unhealthy` container (restart only acts on exit): the alert
  # is calendar-worker's minute watch (qualify_api.creative.worker.render_watch), which
  # posts to Lark after 3 min unhealthy. server-deploy.sh still waits for `healthy`.
  render:
    profiles: ["render"]
    build: ../packages/render
    mem_limit: 1536m
    image: ${QUALIFY_IMAGE_PREFIX:-}qualify-render:${QUALIFY_IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3200/health').then(r=>r.json()).then(j=>process.exit(j.ok&&j.bundleReady?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 60s
    environment:
      PORT: "3200"
      RENDER_CONCURRENCY: "1"
      RENDERS_DIR: /data/renders
      ASSETS_DIR: /data/assets
      TEMPLATES_DIR: /app/templates
      RENDERS_TTL_HOURS: "24"
      LOG_LEVEL: info
    volumes:
      - renders:/data
    <<: *logging

volumes:
  pgdata:
  redisdata:
  uploads:
  avatars:
  reflex_states:
  renders:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true
    name: qualify-edge
