# SonarQube Community Build (free, self-hosted) + its own PostgreSQL.
#
# Derived from SonarSource's reference compose file
# (docker-sonarqube/example-compose-files/sq-with-postgres). Independent of the app's
# root docker-compose.yml: separate Postgres, separate volumes, separate network.
#
# Host prerequisites (Elasticsearch inside SonarQube refuses to start otherwise):
#   sudo sysctl -w vm.max_map_count=524288
#   sudo sysctl -w fs.file-max=131072
#   echo -e "vm.max_map_count=524288\nfs.file-max=131072" | sudo tee /etc/sysctl.d/99-sonarqube.conf
# Compose cannot set host sysctls for an unprivileged container; this is a host step.
#
# Port 9000 is bound to 127.0.0.1 ONLY. SonarQube speaks plain HTTP and the analysis
# token travels in every scanner request — expose it to the internet exclusively behind
# a TLS reverse proxy (Caddy / Traefik on the staging VPS), e.g. Caddyfile:
#   sonar.attitudefactory.co {
#       reverse_proxy 127.0.0.1:9000
#   }
#
# Usage: cp .env.example .env && edit the password, then `docker compose up -d`.
# First login: admin / admin — the UI forces a password change. See README.md.

services:
  sonarqube:
    # `sonarqube:community` floats to the newest Community Build; pinned here so an
    # unattended `docker compose pull` cannot trigger a surprise major upgrade.
    # Upgrade deliberately: bump the tag, `docker compose up -d`, open /setup.
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    hostname: sonarqube
    restart: unless-stopped
    read_only: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in infra/sonarqube/.env}
      # Keep the embedded Elasticsearch from grabbing the whole box (fine for one repo).
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Xms512m -Xmx512m"
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    tmpfs:
      - /tmp:size=256M,mode=1777
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - sonar

  db:
    image: postgres:17
    container_name: sonarqube-db
    hostname: sonarqube-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in infra/sonarqube/.env}
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_postgres:/var/lib/postgresql
    networks:
      - sonar

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  sonarqube_postgres:

networks:
  sonar:
    driver: bridge
