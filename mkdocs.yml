site_name: Qualify — Docs
site_description: Arquitectura, investigación de mercado y backlog de Qualify
docs_dir: docs

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inicio: index.md
  - Investigación de mercado:
      - Proceso para futuras investigaciones: proceso-investigacion-oportunidades.md
      - Registro de validación de features: registro-validacion-features.md
      - Nicho — Inmobiliario:
          - Oferta: oferta-mercado-inmobiliario.md
          - Oportunidad: oportunidades-mercado-inmobiliario.md
          - Demanda (hipótesis): demanda-ventas-inmobiliario.md
      - Nicho — Marca regulada:
          - Oferta: oferta-mercado-marca-regulada.md
          - Oportunidad: oportunidades-mercado-marca-regulada.md
      - Nicho — Qualify como agencia: oferta-mercado-agencia-gestionada.md
      - Pipeline de candidatos (screening): oportunidades-mercado-pipeline-candidatos.md
      - "Disponibilidad de marca «Qualify» (pausada)": disponibilidad-marca-qualify.md
      - Investigaciones previas:
          - Zernio / Fase 0: fase0-zernio-mercado.md
          - Modelo de acceso Tech Provider: research-modelo-acceso-tech-provider.md
          - Dolores creadores/podcasters: dolores-creadores-podcasters.md
          - Research features GTM: research-features-gtm.md
          - Ingeniería inversa — stack GTM: ingenieria-inversa-stack-gtm.md
          - Ingeniería inversa — ManyChat: ingenieria-inversa-manychat.md
          - Ingeniería inversa — Sortfeed: ingenieria-inversa-sortfeed.md
