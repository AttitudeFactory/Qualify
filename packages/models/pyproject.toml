[project]
name = "qualify-models"
version = "0.1.0"
description = "Multimodal analysis cascade (filter, vision, transcription, sentiment) for Qualify's social content pipeline"
readme = "README.md"
authors = [
    { name = "Herwin Rey", email = "hlrd1993@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Payload-shape contracts (qualify_shared.social.ig_shapes) live in the shared
    # package by the architect's ruling: a payload contract must not drag the `ml`
    # group's heavy deps into qualify_api. Same direction as qualify-api -> shared.
    "qualify-shared",
    "accelerate>=1.14.0",
    "huggingface-hub>=1.24.0",
    "pillow>=13.0.0",
    "pydantic>=2.13.4",
    "torch>=2.14.1",
    "torchvision>=0.28.0",
    "transformers>=5.20.1",
    "av>=14",
    "faster-whisper>=1.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
# Eval-only: WER computation. The production cascade never computes WER, so this
# stays out of [project].dependencies — kept in default-groups so `uv run` (local
# + CI test runs) installs it, while a downstream install of qualify_models does not.
eval = [
    "jiwer>=4.0.0",
]

[tool.uv]
default-groups = ["dev", "eval"]

[tool.pytest.ini_options]
markers = [
    "integration: hits the network (hosted HF Inference Provider, model download, or Hub metadata)",
]
addopts = "-m 'not integration'"
# `../shared/src` mirrors the root config's belt-and-suspenders: qualify_shared is
# NOT importable from the shared .venv right now (the editable install is broken —
# see the `uv sync` trap in CLAUDE.md), and test_ig_fixture_shape.py imports the
# QUA-67 contract from qualify_shared.social.ig_shapes. Declaring the dependency in
# [project].dependencies is correct but cannot take effect without a sync, which is
# unsafe while the workspace is shared.
pythonpath = ["src", "../shared/src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
