[project]
name = "qualify-models"
version = "0.1.0"
description = "Multimodal analysis cascade (filter, vision, transcription, sentiment) for Qualify's social content pipeline"
readme = "README.md"
authors = [
    { name = "Herwin Rey", email = "hlrd1993@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "huggingface-hub>=1.24.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
markers = ["integration: hits a hosted HF Inference Provider over the network"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
