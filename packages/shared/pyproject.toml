[project]
name = "qualify-shared"
version = "0.1.0"
description = "Cross-cutting primitives for Qualify: tenant-scoped Postgres session (RLS gate), ID types, domain-event and encryption seams"
readme = "README.md"
authors = [
    { name = "Herwin Rey", email = "hlrd1993@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.4",
    "psycopg[binary]>=3.3.6",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "langfuse>=5.0.2,<6",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
