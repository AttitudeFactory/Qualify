[project]
name = "qualify-docs-harvester"
version = "0.1.0"
description = "Resumable, rate-limited harvester for Meta's Instagram Platform / Graph API developer docs into a local markdown corpus"
readme = "README.md"
authors = [
    { name = "Herwin Rey", email = "hlrd1993@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "httpx>=0.28.1",
    "markdownify>=1.2.0",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
# `integration` exists so a future live-crawl check has a home. It is excluded by
# default: the suite must be runnable with no network, per the sprint's hard gate.
markers = ["integration: performs a live HTTP request against developers.facebook.com"]
addopts = "-m 'not integration'"
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
