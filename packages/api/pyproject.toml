[project]
name = "qualify-api"
version = "0.1.0"
description = "Qualify CRM backend (FastAPI modular monolith): tenancy, connections custody + FSM, OAuth connect flow"
readme = "README.md"
authors = [
    { name = "Herwin Rey", email = "hlrd1993@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "qualify-shared",
    "qualify-creative",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.14.0",
    "pydantic>=2.13.4",
    "cryptography>=50.0.1",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
