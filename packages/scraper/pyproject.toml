[project]
name = "qualify-scraper"
version = "0.1.0"
description = "Zyte-based TikTok/Instagram ingestion: hydration-JSON parsers into typed Pydantic post schemas for Qualify's social pipeline"
readme = "README.md"
authors = [
    { name = "Herwin Rey", email = "hlrd1993@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
markers = ["integration: hits a live scraping vendor over the network"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
