[project]
name = "qualify-scraper"
version = "0.1.0"
description = "Zyte-based TikTok/Instagram ingestion: hydration-JSON parsers into typed Pydantic post schemas for Qualify's social pipeline"
readme = "README.md"
authors = [
    { name = "Herwin Rey", email = "hlrd1993@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
# Research-corpus tooling only (`qualify_scraper.research`). Deliberately NOT a
# default group: yt-dlp tracks an adversarial, undocumented target and will break
# without warning, so no production import path may depend on it.
#
# DO NOT run `uv sync --group corpus` in this repo. CLAUDE.md records a measured
# trap: alternating `uv sync` between dependency groups corrupts the shared
# workspace `.venv` editable installs (observed twice in one day, single agent;
# only `rm -rf .venv && uv sync --group ml` recovered it). Adding a third group to
# that rotation is the same hazard and would break the venv for other agents.
#
# No sync is needed anyway. `research/harvest.py` shells out to the `yt-dlp`
# BINARY, so it never imports this package and never has to be in the venv —
# `uv run --no-sync` is sufficient. If the binary is missing, install it as an
# isolated CLI with `uv tool install yt-dlp`, never via a group sync.
# This entry therefore declares intent and pins a floor; it is not an install step.
corpus = [
    "yt-dlp>=2026.7.4",
]

[tool.pytest.ini_options]
markers = ["integration: hits a live scraping vendor over the network"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
